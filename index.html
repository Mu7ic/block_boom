// ---------- Онлайн-бой ----------
// Адрес сервера. Если игра открыта с сервера (http/https) — берётся тот же адрес сама.
// Если игру открывают просто файлом — впиши сюда адрес VPS, например 'wss://game.example.com/ws'.
const ONLINE_SERVER = '';

function serverUrl() {
  if (ONLINE_SERVER) return ONLINE_SERVER;
  if (location.protocol === 'https:') return 'wss://' + location.host + '/ws';
  if (location.protocol === 'http:') return 'ws://' + location.host + '/ws';
  return null;
}

const Net = {
  ws: null,
  connect() {
    return new Promise((resolve, reject) => {
      const url = serverUrl();
      if (!url) return reject(new Error('nourl'));
      if (this.ws && this.ws.readyState === 1) return resolve();
      if (this.ws) { try { this.ws.close(); } catch (e) {} }
      const ws = new WebSocket(url);
      this.ws = ws;
      const to = setTimeout(() => { ws.close(); reject(new Error('timeout')); }, 6000);
      ws.onopen = () => { clearTimeout(to); resolve(); };
      ws.onerror = () => { clearTimeout(to); reject(new Error('error')); };
      ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } onNet(m); };
      ws.onclose = () => { if (this.ws === ws) { this.ws = null; onNet({ t: 'closed' }); } };
    });
  },
  send(m) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(m)); },
};

const isColor = c => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c);
let lobbyCode = null, oppName = 'Соперник';

function lobbyStatus(text) { $('lobbyStatus').textContent = text || ''; }
function lobbyView(waiting) {
  $('lobbyMain').style.display = waiting ? 'none' : 'flex';
  $('lobbyWait').style.display = waiting ? 'flex' : 'none';
  $('nameInput').style.display = waiting ? 'none' : '';
}
function openOnline(joinCode) {
  stopDuel();
  $('nameInput').value = localStorage.getItem('bp-name') || '';
  $('codeInput').value = joinCode || '';
  lobbyView(false);
  lobbyStatus(serverUrl() ? '' : 'Онлайн работает, когда игра открыта по ссылке с сервера');
  show('online');
  if (joinCode) joinRoom();
}
function playerName() {
  const n = $('nameInput').value.trim().slice(0, 16);
  localStorage.setItem('bp-name', n);
  return n || 'Игрок';
}
async function ensureConnected() {
  lobbyStatus('Подключаемся…');
  try { await Net.connect(); lobbyStatus(''); return true; }
  catch (e) { lobbyStatus(e.message === 'nourl' ? 'Онлайн работает, когда игра открыта по ссылке с сервера' : 'Сервер недоступен. Попробуй позже или сыграй с ботом 🤖'); return false; }
}
async function createRoom() {
  if (!(await ensureConnected())) return;
  Net.send({ t: 'create', name: playerName() });
}
async function joinRoom() {
  const code = $('codeInput').value.replace(/\D/g, '');
  if (code.length !== 4) { lobbyStatus('Введи код из 4 цифр'); return; }
  if (!(await ensureConnected())) return;
  Net.send({ t: 'join', code, name: playerName() });
}
function shareRoom() {
  const link = location.protocol.startsWith('http') ? `${location.origin}${location.pathname}#join=${lobbyCode}` : '';
  const text = `Го в «${GAME_NAME}» онлайн! Код комнаты: ${lobbyCode}` + (link ? `\n${link}` : '');
  if (navigator.share) navigator.share({ text }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => lobbyStatus('Скопировано — отправь другу'), () => {});
}

// Свой ход → сопернику
function sendState(ev = {}) {
  if (mode !== 'online' || !duel) return;
  Net.send({
    t: 'state', score, skin: skinIdx,
    board: board.map(c => (c ? c.c : null)),
    tray: pieces.map(p => (p ? { w: p.w, h: p.h, color: p.color, cells: p.cells.map(([r, c]) => [r, c]) } : null)),
    ...ev,
  });
}

// Ход соперника → на мини-поле
function applyOpp(m) {
  if (mode !== 'online' || !bot || !Array.isArray(m.board) || m.board.length !== N * N) return;
  bot.board = m.board.map(c => (isColor(c) ? { c, f: null } : null));
  bot.pieces = (Array.isArray(m.tray) ? m.tray.slice(0, 3) : []).map(p =>
    p && isColor(p.color) && Array.isArray(p.cells)
      ? { w: Math.min(5, p.w | 0), h: Math.min(5, p.h | 0), color: p.color, cells: p.cells.slice(0, 25).map(([r, c]) => [r | 0, c | 0, null]) }
      : null);
  bot.score = Math.max(0, m.score | 0);
  if (Number.isInteger(m.skin) && m.skin >= 0 && m.skin < SKINS.length && m.skin !== bot.skin) {
    bot.skin = m.skin; setSkinClass($('botPanel'), m.skin);
  }
  renderBot();
  const cl = Array.isArray(m.cleared) ? m.cleared : [];
  const clSet = new Set(cl.map(x => x[0]));
  (Array.isArray(m.placed) ? m.placed : []).forEach(i => { if (!clSet.has(i) && botEls[i]) botEls[i].classList.add('land'); });
  cl.forEach(([i, c]) => {
    if (!botEls[i] || !isColor(c)) return;
    paintCell(botEls[i], { c, f: null });
    botEls[i].classList.add('clearing');
  });
  if (cl.length) setTimeout(() => { if (bot) botEls.forEach((el, k) => paintCell(el, bot.board[k])); }, 360);
  if (m.n > 0) { botFloat(`+${m.gained | 0}` + (m.n >= 3 ? ' ×5' : '')); SFX.botClear(); }
  if (m.reset) botFloat('новое поле');
  $('botStatus').textContent = 'играет';
}

function countdown(ms, done) {
  let n = Math.round(ms / 1000);
  const token = duel;
  const tickNum = () => {
    if (duel !== token) return;
    document.querySelectorAll('.countdown').forEach(e => e.remove());
    const el = document.createElement('div');
    el.className = 'countdown';
    el.textContent = n > 0 ? n : 'Старт!';
    if (n <= 0) el.style.fontSize = '64px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
    if (n > 0) { SFX.tick(); buzz(15); n--; setTimeout(tickNum, 1000); }
    else { SFX.skin(); buzz(40); done(); }
  };
  tickNum();
}

function startOnlineMatch(m) {
  oppName = String(m.opponent || 'Соперник').slice(0, 16);
  startGame('online');
  bot = { board: Array(N * N).fill(null), pieces: [], score: 0, combo: 0, skin: 0 };
  setSkinClass($('botPanel'), 0);
  renderBot();
  $('botHead').textContent = '🧑 ' + oppName;
  $('botStatus').textContent = 'готовится…';
  $('duelAgain').disabled = false;
  duel = { online: true, timeLeft: Math.round(m.duration / 1000) };
  updateTimer();
  finished = true; // пока идёт отсчёт, ходить нельзя
  countdown(m.countdown, () => {
    finished = false;
    duel.endAt = Date.now() + m.duration;
    duel.timerId = setInterval(onlineTick, 250);
    $('botStatus').textContent = 'играет';
    sendState();
  });
}

function onlineTick() {
  if (!duel) return;
  const t = Math.max(0, Math.ceil((duel.endAt - Date.now()) / 1000));
  if (t !== duel.timeLeft) { duel.timeLeft = t; updateTimer(); }
  if (t <= 0 && !finished) {
    finished = true;
    $('botStatus').textContent = 'подсчёт…';
    // Итог объявляет сервер; если он не ответит — считаем по своим данным
    duel.fallback = setTimeout(() => endOnline(score, bot ? bot.score : 0), 4500);
  }
}

function endOnline(you, them, note) {
  if (mode !== 'online') return;
  stopDuel();
  finished = true;
  document.querySelectorAll('.countdown').forEach(e => e.remove());
  $('botStatus').textContent = 'бой окончен';
  $('duelTitle').textContent = note ? note : you > them ? 'Ты победил! 🏆' : you < them ? `${oppName} победил` : 'Ничья 🤝';
  $('duelText').innerHTML = `Ты <b>${you}</b> : <b>${them}</b> ${oppName.replace(/[<>&]/g, '')}`;
  $('duelAgain').disabled = !!note;
  $('duelAgain').style.display = note ? 'none' : '';
  setTimeout(() => {
    $('overDuel').style.display = 'flex';
    if (note || you > them) { SFX.win(); buzz([40, 60, 40, 60, 120]); }
    else if (you < them) { SFX.lose(); buzz(200); }
    else SFX.record();
  }, 400);
}

// Сообщения от сервера
function onNet(m) {
  switch (m.t) {
    case 'created':
      lobbyCode = m.code;
      $('bigCode').textContent = m.code;
      lobbyView(true);
      lobbyStatus('');
      break;
    case 'error':
      lobbyView(false);
      lobbyStatus(m.msg || 'Ошибка');
      break;
    case 'start':
      $('overDuel').style.display = 'none';
      $('duelAgain').style.display = '';
      startOnlineMatch(m);
      break;
    case 'opp':
      applyOpp(m);
      break;
    case 'oppRematch':
      if ($('overDuel').style.display === 'flex')
        $('duelText').insertAdjacentHTML('beforeend', `<br><small>${oppName.replace(/[<>&]/g, '')} хочет реванш!</small>`);
      break;
    case 'end':
      endOnline(m.you | 0, m.them | 0);
      break;
    case 'oppLeft':
      if (mode === 'online' && duel) endOnline(score, bot ? bot.score : 0, 'Соперник вышел — победа! 🏆');
      else if (mode === 'online' && $('overDuel').style.display === 'flex') {
        $('duelAgain').style.display = 'none';
        $('duelText').insertAdjacentHTML('beforeend', '<br><small>Соперник ушёл</small>');
      } else if ($('online').classList.contains('active')) { lobbyView(false); lobbyStatus('Соперник отключился'); }
      break;
    case 'closed':
      if (mode === 'online' && duel) {
        stopDuel(); finished = true;
        $('duelTitle').textContent = 'Связь потеряна 📡';
        $('duelText').innerHTML = `Ты <b>${score}</b> : <b>${bot ? bot.score : 0}</b> ${oppName.replace(/[<>&]/g, '')}`;
        $('duelAgain').style.display = 'none';
        $('overDuel').style.display = 'flex';
      } else if ($('online').classList.contains('active')) { lobbyView(false); lobbyStatus('Связь с сервером потеряна'); }
      break;
  }
}

$('btnOnline').onclick = () => openOnline();
$('btnCreate').onclick = createRoom;
$('btnJoin').onclick = joinRoom;
$('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
$('codeInput').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); });
$('btnShare').onclick = shareRoom;
$('btnCancel').onclick = () => { Net.send({ t: 'leave' }); lobbyView(false); lobbyStatus(''); };
$('onlineBack').onclick = () => { Net.send({ t: 'leave' }); show('menu'); };

// ---------- Логотип ----------
function logoHTML() {
  const pal = ['#ff5d5d', '#ffa93b', '#ffd84d', '#4fd67a', '#36c3ff', '#5d7bff', '#b45dff', '#ff6fc8'];
  let k = 0;
  const word = w => `<span class="w">${[...w].map(ch =>
    `<span class="ch" style="--c:${pal[(k * 3) % pal.length]};--k:${k++}">${ch}</span>`).join('')}</span>`;
  const icon = [1, 1, 1, 1, 0, 0, 1, 1, 1].map((on, i) =>
    `<div class="cell${on ? ' block' : ''}" style="--c:${pal[i % pal.length]}"></div>`).join('');
  return `<div class="logoIcon">${icon}</div><div class="logoText">${word('БЛОК')}${word('БУМ!')}</div>`;
}
$('splashLogo').innerHTML = logoHTML();
$('menuLogo').innerHTML = logoHTML();

// ---------- Заставка: блоки падают, средний ряд «взрывается» ----------
(function splash() {
  const pal = ['#ff5d5d', '#ffa93b', '#ffd84d', '#4fd67a', '#36c3ff', '#5d7bff', '#b45dff', '#ff6fc8'];
  const grid = $('splashGrid');
  const cells = [];
  for (let i = 0; i < 16; i++) {
    const d = document.createElement('div');
    d.className = 'cell block';
    d.style.setProperty('--c', pal[(i * 5) % pal.length]);
    d.style.setProperty('--k', 15 - i);
    grid.appendChild(d);
    cells.push(d);
  }
  setTimeout(() => {
    [4, 5, 6, 7, 8, 9, 10, 11].forEach((i, n) => {
      const el = cells[i];
      el.style.animationDelay = (n % 4) * 40 + 'ms';
      el.classList.add('clearing');
      const b = el.getBoundingClientRect();
      burst(b.left + b.width / 2, b.top + b.height / 2, el.style.getPropertyValue('--c'), 6, (n % 4) * 40);
    });
  }, 1100);
  let done = false;
  $('splash').addEventListener('click', () => {
    if (done) return;
    done = true;
    SFX.boom(); buzz(40);
    // Ссылка-приглашение вида …#join=1234 — сразу в онлайн-лобби
    const jm = location.hash.match(/join=(\d{4})/);
    if (jm) { history.replaceState(null, '', location.pathname); openOnline(jm[1]); return; }
    show('menu');
    if (!localStorage.getItem('bp-tut')) setTimeout(() => openTutorial(), 250);
  });
})();

// ---------- Настройки в меню ----------
function refreshToggles() {
  $('togSound').classList.toggle('off', !Settings.sound);
  $('togMusic').classList.toggle('off', !Settings.music);
  $('togVibro').classList.toggle('off', !Settings.vibro);
  $('btnMute').textContent = (Settings.sound || Settings.music) ? '🔊' : '🔇';
}
if (!navigator.vibrate) $('togVibro').style.display = 'none'; // iPhone
$('togSound').onclick = () => { Sound.setSound(!Settings.sound); refreshToggles(); };
$('togMusic').onclick = () => { Sound.unlock(); Sound.setMusic(!Settings.music); refreshToggles(); };
$('togVibro').onclick = () => { Settings.vibro = !Settings.vibro; refreshToggles(); buzz(40); };
$('btnMute').onclick = () => {
  const on = !(Settings.sound || Settings.music);
  Sound.setSound(on); Sound.setMusic(on); refreshToggles();
};
refreshToggles();

function updateMenu() {
  const got = Coll.got(), seen = Coll.seen();
  const hasNew = [...got].some(id => !seen.has(id));
  $('collCount').innerHTML = `${got.size}/${SKINS.length}` + (hasNew ? '<span class="dot"></span>' : '');
}

// ---------- Обучение ----------
const TUT = [
  { t: 'Перетаскивай фигуры', x: 'Бери фигуру снизу и ставь на поле. Хватать можно за любое место вокруг фигуры.',
    demo: el => {
      const cells = [];
      for (let i = 0; i < 20; i++) {
        const on = [0, 1, 2, 5, 6, 10, 11, 12, 15, 16, 17, 19].includes(i);
        cells.push(`<div class="cell${on ? ' block' : ''}" style="--c:#5d7bff"></div>`);
      }
      el.innerHTML = `<div class="dGrid">${cells.join('')}</div>
        <div class="dPiece"><div class="cell block" style="--c:#ff6fc8"></div><div class="cell block" style="--c:#ff6fc8"></div></div>
        <div class="dHand">👆</div>`;
    } },
  { t: 'Собирай линии', x: 'Заполни строку или столбец целиком — они исчезнут и дадут очки. Несколько ходов подряд — комбо!',
    demo: el => {
      const row = Array.from({ length: 8 }, (_, i) =>
        `<div class="cell${i < 6 ? ' block' : ''}" style="--c:#36c3ff"></div>`).join('');
      el.innerHTML = `<div class="dLine">${row}<div class="dDrop">
        <div class="cell block" style="--c:#ffd84d"></div><div class="cell block" style="--c:#ffd84d"></div></div></div>`;
    } },
  { t: '3 линии сразу = ×5', x: 'Снеси 3 и больше линий одним ходом — очки ×5 и новый стиль блоков. Собери все 20!',
    demo: el => {
      const pal = ['#ff5d5d', '#36c3ff', '#4fd67a', '#ffd84d'];
      el.innerHTML = `<div class="dX5">×5</div><div class="dSkins" id="dSkins">${pal.map((c, i) =>
        `<div class="cell block" style="--c:${c};--i:${i}"></div>`).join('')}</div>`;
      let k = 1;
      const box = el.querySelector('#dSkins');
      setSkinClass(box, k);
      tutTimer = setInterval(() => { k = (k % (SKINS.length - 1)) + 1; setSkinClass(box, k); }, 1100);
    } },
  { t: 'Три режима', x: '<b>Классика</b> — играй на рекорд.<br><b>Аркада</b> — 30 уровней, собирай фрукты.<br><b>Против бота</b> — кто больше за 3 минуты.',
    demo: el => { el.innerHTML = '<div class="dModes"><span>🏆</span><span>🍓</span><span>🤖</span></div>'; } },
];
let tutStep = 0, tutTimer = null;
function renderTut() {
  clearInterval(tutTimer);
  const s = TUT[tutStep];
  s.demo($('tutDemo'));
  $('tutTitle').textContent = s.t;
  $('tutText').innerHTML = s.x;
  $('tutDots').innerHTML = TUT.map((_, i) => `<i class="${i === tutStep ? 'on' : ''}"></i>`).join('');
  $('tutNext').textContent = tutStep === TUT.length - 1 ? 'Играть!' : 'Далее';
  $('tutSkip').style.visibility = tutStep === TUT.length - 1 ? 'hidden' : '';
  const card = document.querySelector('.tutCard');
  card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
}
function openTutorial() { tutStep = 0; renderTut(); $('tutorial').style.display = 'flex'; }
function closeTutorial() {
  clearInterval(tutTimer);
  $('tutorial').style.display = 'none';
  localStorage.setItem('bp-tut', '1');
}
$('tutNext').onclick = () => { if (tutStep < TUT.length - 1) { tutStep++; renderTut(); } else closeTutorial(); };
$('tutSkip').onclick = closeTutorial;
$('btnHelp').onclick = openTutorial;

// Короткая подсказка при первом входе в режим
function hintOnce(key, html) {
  if (localStorage.getItem('bp-h-' + key)) return;
  localStorage.setItem('bp-h-' + key, '1');
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const d = document.createElement('div');
  d.className = 'toast';
  d.innerHTML = html;
  document.body.appendChild(d);
  setTimeout(() => d.classList.add('out'), 4200);
  setTimeout(() => d.remove(), 4700);
}

// ---------- Экран коллекции ----------
function renderCollection() {
  const got = Coll.got(), seen = Coll.seen();
  const pal = ['#ff5d5d', '#36c3ff', '#4fd67a', '#ffd84d'];
  $('collGrid').innerHTML = SKINS.map((s, i) => {
    const open = got.has(s.id);
    const cls = 'skinCard' + (open ? '' : ' locked') + (i === skinIdx ? ' current' : '') + (open && !seen.has(s.id) ? ' isNew' : '');
    const cells = pal.map((c, k) => `<div class="cell block" style="--c:${c};--i:${k}"></div>`).join('');
    return `<div class="${cls}"><div class="skinPrev skin-${open ? s.id : 'classic'}">${cells}</div>
      ${open ? '' : '<span class="lock">🔒</span>'}<div class="nm">${open ? s.name : '???'}</div></div>`;
  }).join('');
  $('collText').textContent = `Собрано ${got.size} из ${SKINS.length}`;
  requestAnimationFrame(() => { $('collBar').style.width = (got.size / SKINS.length * 100) + '%'; });
  Coll.markSeen();
}
$('btnCollection').onclick = () => { $('collBar').style.width = '0'; renderCollection(); show('collection'); };

// ---------- «Установить на телефон» ----------
(function setupInstall() {
  // Иконка рисуется кодом — отдельных файлов не нужно
  const cv = document.createElement('canvas');
  cv.width = cv.height = 512;
  const g = cv.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 512, 512);
  grd.addColorStop(0, '#2a3a8a'); grd.addColorStop(1, '#5a3fa8');
  g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
  const pal = ['#ff5d5d', '#ffa93b', '#ffd84d', '#4fd67a', null, '#36c3ff', '#5d7bff', '#b45dff', '#ff6fc8'];
  pal.forEach((c, i) => {
    if (!c) return;
    const x = 76 + (i % 3) * 124, y = 76 + Math.floor(i / 3) * 124;
    g.fillStyle = c; g.beginPath(); g.roundRect ? g.roundRect(x, y, 112, 112, 22) : g.rect(x, y, 112, 112); g.fill();
    g.fillStyle = 'rgba(255,255,255,.3)'; g.fillRect(x + 14, y + 10, 84, 12);
    g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(x + 8, y + 96, 96, 10);
  });
  g.font = '900 96px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#fff'; g.fillText('💥', 256, 262);
  const png = cv.toDataURL('image/png');
  const link = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
  link('icon', png);
  link('apple-touch-icon', png);
  if (location.protocol.startsWith('http')) {
    const manifest = {
      name: GAME_NAME, short_name: GAME_NAME, start_url: location.href.split('#')[0],
      display: 'standalone', orientation: 'portrait', background_color: '#1d2757', theme_color: '#1d2757',
      icons: [{ src: png, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }],
    };
    link('manifest', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest)));
  }

  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('btnInstall').style.display = ''; });
  if (iOS && !standalone) $('btnInstall').style.display = '';
  $('btnInstall').onclick = () => {
    if (deferred) { deferred.prompt(); deferred = null; $('btnInstall').style.display = 'none'; return; }
    hintOnce('ios-' + Date.now(), 'Чтобы установить игру: нажми <b>«Поделиться»</b> ⬆️<br>и выбери <b>«На экран Домой»</b>');
  };
})();

applySkin(skinIdx);
if (!localStorage.getItem('bp-seen')) Coll.markSeen(); // стартовая «Классика» — не новинка
updateMenu();
$('btnClassic').onclick = () => startGame('classic');
$('btnArcade').onclick = () => { renderLevels(); show('levels'); };
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));
$('btnBack').onclick = () => {
  stopDuel(); finished = true;
  if (mode === 'online') { Net.send({ t: 'leave' }); show('menu'); return; }
  if (mode === 'arcade') { renderLevels(); show('levels'); } else show('menu');
};
$('btnDuel').onclick = () => startGame('duel');
$('duelAgain').onclick = () => {
  if (mode !== 'online') return startGame('duel');
  Net.send({ t: 'rematch' });
  $('duelAgain').disabled = true;
  $('duelText').insertAdjacentHTML('beforeend', '<br><small>Ждём соперника…</small>');
};
$('duelMenu').onclick = () => { if (mode === 'online') Net.send({ t: 'leave' }); show('menu'); };
$('btnRestart').onclick = () => startGame(mode, level);
$('loseRetry').onclick = () => startGame(mode, level);
$('loseMenu').onclick = () => $('btnBack').onclick();
$('winNext').onclick = () => startGame('arcade', level + 1);
$('winMenu').onclick = () => { renderLevels(); show('levels'); };
