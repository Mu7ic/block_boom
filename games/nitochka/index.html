  :root{
    --ink:#1F2742; --accent-text:#6260C6; --accent:#D2D0FF; --accent-bg:#E9E8FF;
    --graphic:#E8623E; --el-bg:#FFF4DF; --page:#FFFDF7; --btn:#FED78C;
    --top:env(safe-area-inset-top, 0px); --bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{background:var(--page);color:var(--ink);overflow:hidden;
    font-family:'Onest',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  .screen{display:none;flex-direction:column;align-items:center;height:100vh;height:100dvh;
    padding:calc(12px + var(--top)) 16px calc(16px + var(--bottom))}
  .screen.active{display:flex}
  button{font:inherit;font-weight:700;font-size:18px;color:var(--ink);background:var(--btn);border:0;
    border-radius:999px;padding:12px 28px;cursor:pointer;transition:transform .1s}
  button:active{transform:scale(.96)}
  button.ghost,.pill,.corner,.tog{background:var(--accent-bg)}
  button[disabled]{opacity:.45}
  .topbar{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;min-height:40px;gap:8px}
  .corner{font-size:14px;padding:8px 14px}
  .tog{font-size:16px;padding:8px 12px}
  .wallet{display:flex;align-items:center;gap:7px;background:var(--el-bg);border-radius:999px;
    padding:7px 14px 7px 9px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;
    box-shadow:inset 0 0 0 1.5px rgba(31,39,66,.06)}
  .wallet.bump{animation:pulse .4s}
  /* Пуговица-валюта */
  .pg{display:inline-block;width:1em;height:1em;border-radius:50%;vertical-align:-.14em;flex:none;
    background:
      radial-gradient(circle at 37% 37%, #6e2410 0 .07em, transparent .08em),
      radial-gradient(circle at 63% 37%, #6e2410 0 .07em, transparent .08em),
      radial-gradient(circle at 37% 63%, #6e2410 0 .07em, transparent .08em),
      radial-gradient(circle at 63% 63%, #6e2410 0 .07em, transparent .08em),
      radial-gradient(circle, #E8623E 0 .3em, #c74a29 .31em .42em, #E8623E .43em);
    box-shadow:0 .06em 0 rgba(31,39,66,.25)}
  @keyframes pulse{50%{transform:scale(1.25);color:var(--graphic)}}

  /* ---------- Меню ---------- */
  #menu{justify-content:flex-start;gap:12px;overflow-y:auto;touch-action:pan-y}
  .menuBody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%}
  .hero{width:120px;height:120px;position:relative;animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
  .title{font-weight:900;font-size:46px;line-height:.95;text-align:center;letter-spacing:.3px;margin:0}
  .title span{display:block}
  .title .a{color:var(--graphic)} .title .b{color:var(--accent-text);font-size:.5em;margin-top:4px}
  .brandSub{font-size:14px;font-weight:600;color:var(--accent-text);margin-top:-4px}
  .big{width:min(290px, 86vw);font-size:24px;padding:16px 0;
    box-shadow:0 6px 0 rgba(31,39,66,.16), 0 0 30px rgba(254,215,140,.7);animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.04)}}
  .big small{display:block;font-size:13px;font-weight:500;opacity:.85}
  .price{display:inline-flex;align-items:center;gap:5px;margin-top:5px;background:rgba(31,39,66,.08);
    border-radius:999px;padding:3px 12px;font-size:14px;font-weight:800}
  .card{background:var(--el-bg);border-radius:16px;padding:10px 14px;width:min(300px, 86vw);font-size:14px;line-height:1.3}
  .card h4{margin:0 0 8px;font-size:13px;font-weight:700;opacity:.6;text-transform:uppercase;letter-spacing:1px}
  .dRow{display:flex;align-items:center;gap:10px}
  .dRow .ic{font-size:20px;width:24px;text-align:center}
  .dRow small{display:block;opacity:.6;font-size:12px}
  .dots3{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}
  .dots3 i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .dots3 i.on{background:var(--graphic)}
  .stitches{display:flex;gap:6px;justify-content:space-between}
  .stc{width:50px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;padding:0;
    font-size:10.5px;font-weight:700;border-radius:10px;position:relative;line-height:1.1}
  .stc canvas{width:46px;height:34px;border-radius:8px;background:#FFFDF7;box-shadow:inset 0 0 0 1px rgba(31,39,66,.1)}
  .stc.cur canvas{outline:2.5px solid var(--accent-text);outline-offset:2px}
  .stc.locked canvas{filter:grayscale(.7) opacity(.55)}
  .stc .tag{display:flex;align-items:center;gap:2px;white-space:nowrap}
  .stc.confirm .tag{color:var(--graphic)}
  .menuRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .pill{font-size:15px;padding:10px 18px}

  /* ---------- Игра ---------- */
  #game{gap:6px}
  header{display:flex;gap:30px;justify-content:center;margin-top:2px}
  .stat{text-align:center}
  .stat span{font-size:12px;opacity:.6;text-transform:uppercase;letter-spacing:1.5px}
  .stat b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat b .pg{width:.75em;height:.75em}
  .stat b.pulse{animation:pulse .35s}
  #timer.hurry{color:var(--graphic)}
  .infoBar{width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    min-height:30px;font-weight:700;font-size:15px}
  .infoBar .sz{background:var(--accent-bg);color:var(--accent-text);border-radius:999px;padding:2px 10px;font-size:14px;margin-left:4px}
  .spoolBar{display:flex;align-items:center;gap:6px;font-size:14px;font-variant-numeric:tabular-nums}
  .spoolBar .track{width:86px;height:10px;border-radius:5px;background:var(--accent-bg);overflow:hidden}
  .spoolBar .fill{display:block;height:100%;background:var(--accent-text);border-radius:5px;width:100%}
  .spoolBar.empty{opacity:.45}
  #stage{position:relative;width:100%;max-width:440px;flex:1;min-height:0}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
  #stage.shake{animation:shake .35s}
  @keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
  .tools{display:flex;gap:10px;justify-content:center}
  .tools button{font-size:15px;padding:9px 18px}
  .gameHint{font-size:14px;font-weight:600;color:var(--accent-text);text-align:center;min-height:36px;max-width:400px;
    display:flex;align-items:center;justify-content:center;line-height:1.25}
  .float{position:absolute;left:50%;transform:translate(-50%,-50%);font-weight:900;font-size:30px;pointer-events:none;
    white-space:nowrap;animation:rise 1.1s ease-out forwards;color:var(--ink);text-shadow:0 2px 0 rgba(255,253,247,.9)}
  .float small{display:block;text-align:center;font-size:15px}
  .float.good{color:var(--accent-text)} .float.perfect{color:var(--graphic)} .float.miss{color:#7d8399}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,-20%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
    100%{opacity:0;transform:translate(-50%,-150%) scale(1)}}

  /* ---------- Итог ---------- */
  .overlay{position:fixed;inset:0;background:rgba(255,253,247,.95);display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;z-index:20;padding:20px;animation:fadeIn .3s}
  @keyframes fadeIn{from{opacity:0}}
  .overlay h2{margin:0;font-size:32px;text-align:center}
  .res{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--el-bg);border-radius:20px;
    padding:16px 22px;min-width:min(300px, 88vw)}
  .res p{margin:0;font-size:18px}
  .res .sub{font-size:14px;opacity:.7;text-align:center}
  .earn{display:flex;align-items:center;gap:10px;font-size:46px;font-weight:900;color:var(--graphic)}
  .earn .pg{width:44px;height:44px}
  .tiers{display:flex;gap:4px;margin-top:4px}
  .tiers i{display:flex;flex-direction:column;align-items:center;font-style:normal;font-size:11px;opacity:.5;
    background:var(--accent-bg);border-radius:8px;padding:4px 6px;min-width:44px}
  .tiers i b{font-size:14px}
  .tiers i.got{opacity:1;background:var(--accent-text);color:#fff}
  .nextTier{font-size:14px;opacity:.75;text-align:center}
  .walletLine{font-size:15px;opacity:.85;display:flex;align-items:center;gap:6px}
  .row{display:flex;gap:12px}

  /* ---------- Правила ---------- */
  #rules{overflow-y:auto;touch-action:pan-y;height:100vh;height:100dvh}
  #rules h2{margin:14px 0 12px}
  .rulesBody{width:min(420px, 92vw);display:flex;flex-direction:column;gap:10px}
  .rcard{background:var(--el-bg);border-radius:16px;padding:12px 16px;font-size:14px;line-height:1.45}
  .rcard h3{margin:0 0 6px;font-size:17px;color:var(--accent-text)}
  .rcard ul{margin:0;padding-left:18px}
  .rcard table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
  .rcard td{padding:3px 0;border-bottom:1px solid rgba(31,39,66,.1)}
  .rcard td:last-child{text-align:right;font-weight:800}
  .rcard.honest{background:var(--accent-bg)}
  .resetBtn{font-size:14px;padding:9px 18px;margin-top:16px}
  .resetBtn.confirm{background:var(--graphic);color:#fff}
  .smallHint{opacity:.6;font-size:13px;text-align:center;max-width:300px;margin:8px 0 20px}

  /* ---------- Тост ---------- */
  .toast{position:fixed;left:50%;bottom:calc(24px + var(--bottom));transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:12px 18px;border-radius:16px;font-size:15px;line-height:1.4;width:max-content;max-width:88vw;text-align:center;
    z-index:30;pointer-events:none;box-shadow:0 10px 30px rgba(31,39,66,.3);animation:toastIn .35s cubic-bezier(.3,1.5,.6,1)}
  .toast.out{animation:fadeOut .4s forwards}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,20px) scale(.9)}}
  @keyframes fadeOut{to{opacity:0}}

  @media (max-height:700px){
    .hero{width:90px;height:90px}
    .title{font-size:38px}
    .big{padding:12px 0;font-size:21px}
    .stat b{font-size:22px}
    header{gap:24px}
    .gameHint{min-height:34px;font-size:13px}
    .tools button{padding:8px 16px}
  }

  /* Рука-подсказка в первом забеге */
  #hand{position:fixed;left:0;top:0;font-size:42px;z-index:25;pointer-events:none;
    filter:drop-shadow(0 4px 6px rgba(31,39,66,.35));animation:handMove 2.2s ease-in-out infinite}
  @keyframes handMove{0%,10%{transform:translate(var(--x0),var(--y0)) scale(1);opacity:0}

<script>
'use strict';
const $ = id => document.getElementById(id);
const PG = '<span class="pg"></span>';
const KEY = k => 'pnt-' + k; // у каждой игры своё демо-хранилище

// ---------- Экономика: все числа в одном месте (их же — в записке) ----------
const ECON = {
  START_WALLET: 100,   // демо-баланс
  FREE_PER_DAY: 1,     // бесплатных забегов в день
  ENTRY: 10,           // платный забег
  // Награда по порогам очков — только умение, без случайности.
  // Пороги подобраны симуляцией (реальный генератор и подсчёт очков, 4 типа игроков, по 400 забегов):
  // медиана новичок ~330, средний ~460, хороший ~780, сильный ~1220; выплата за вход ≈ 4,8.
  TIERS: [
    { at: 260, pay: 2 },
    { at: 450, pay: 5 },
    { at: 750, pay: 8 },
    { at: 1000, pay: 12 },
    { at: 1250, pay: 16 },
  ],
  DAILY_CAP: 60,       // больше этого за сутки не начисляем
  STREAK_DAYS: 3,      // играешь N дней подряд — +1 бесплатный забег в день
  STITCH_PRICE: 10,    // вид стежка — только внешний вид
};
const RUN_TIME = 90;      // секунд

// <logic> ---------- Чистая логика без DOM (её же запускает симуляция баланса) ----------
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

const NCOL = 10;                                 // цветов ниток (у каждого свой значок)
const SIZES = [4, 5, 5, 6, 6, 7, 7, 7, 8];       // размер вышивки по номеру, дальше 8×8
const sizeOf = i => SIZES[Math.min(i, SIZES.length - 1)];
const crossOf = i => i < 2 ? 0 : i < 5 ? 1 : 2; // сколько пуговиц-«переходов» на поле
// Очки
const PTS_CELL = 5;        // за каждую клетку решённой вышивки
const FILL_MULT = 1.5;     // всё поле зашито — ×1,5
const SPOOL_PTS = 5;       // за каждую секунду, оставшуюся на катушке
const PARTIAL_PTS = 5;     // за соединённую пару в недошитой вышивке (когда время вышло)
const parTime = n => Math.round(n * n * 0.9);    // «катушка» — норма времени, секунд
function scoreSolved(n, secs, filled) {
  const base = PTS_CELL * n * n;
  const fill = filled ? Math.round(base * (FILL_MULT - 1)) : 0;
  const spool = Math.max(0, Math.floor(parTime(n) - secs)) * SPOOL_PTS;
  return { base, fill, spool, total: base + fill + spool };
}

// Случайный гамильтонов путь по сетке n×n (алгоритм «backbite»): змейка + много случайных перестроек
function hamPath(n, rnd) {
  const p = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) p.push(r * n + (r % 2 ? n - 1 - c : c));
  const iters = n * n * 14;
  for (let k = 0; k < iters; k++) {
    if (rnd() < .5) p.reverse();
    const h = p[0], r = h / n | 0, c = h % n, nb = [];
    if (r > 0) nb.push(h - n); if (r < n - 1) nb.push(h + n); if (c > 0) nb.push(h - 1); if (c < n - 1) nb.push(h + 1);
    const x = nb[rnd() * nb.length | 0];
    if (x === p[1]) continue;
    const i = p.indexOf(x);
    for (let a = 0, b = i - 1; a < b; a++, b--) { const t = p[a]; p[a] = p[b]; p[b] = t; }
  }
  return p;
}
const adj = (a, b, n) => Math.abs((a / n | 0) - (b / n | 0)) + Math.abs(a % n - b % n) === 1;
// Режем путь на нитки длиной от 3 клеток
function cutPath(p, n, rnd) {
  const segs = []; let i = 0;
  while (i < p.length) {
    const rem = p.length - i;
    let L = 3 + (rnd() * n | 0);
    if (L > rem || rem - L < 3) L = rem;
    segs.push(p.slice(i, i + L)); i += L;
  }
  return segs;
}
// Поворот «Ниточки»: пуговица-переход. Если нитка идёт прямо через клетку, а слева и справа (или сверху и снизу)
// от неё кончаются две другие нитки — сшиваем их в одну, которая «ныряет» под пуговицу поперёк.
function addCross(segs, n, want, rnd) {
  const cross = [];
  for (let k = 0; k < want; k++) {
    const own = new Map();
    segs.forEach((s, si) => s.forEach(c => { if (!cross.includes(c)) own.set(c, si); }));
    const endOf = c => { const si = own.get(c); if (si === undefined) return -1; const s = segs[si]; return s[0] === c || s[s.length - 1] === c ? si : -1; };
    const cands = [];
    for (let r = 1; r < n - 1; r++) for (let c = 1; c < n - 1; c++) {
      const x = r * n + c;
      if (cross.some(y => Math.abs((y / n | 0) - r) + Math.abs(y % n - c) <= 2)) continue;
      const si = own.get(x), s = segs[si], j = s.indexOf(x);
      if (j <= 0 || j >= s.length - 1) continue;
      const d1 = s[j - 1] - x, d2 = s[j + 1] - x;
      if (d1 !== -d2) continue;                       // нитка должна идти прямо
      const vert = Math.abs(d1) === n;
      const a = vert ? x - 1 : x - n, b = vert ? x + 1 : x + n;
      const A = endOf(a), B = endOf(b);
      if (A < 0 || B < 0 || A === B || A === si || B === si) continue;
      const sa = segs[A], sb = segs[B];
      const ea = sa[0] === a ? sa[sa.length - 1] : sa[0], eb = sb[0] === b ? sb[sb.length - 1] : sb[0];
      if (adj(ea, eb, n)) continue;
      cands.push({ x, A, B, a, b });
    }
    if (!cands.length) break;
    const q = cands[rnd() * cands.length | 0];
    let sa = segs[q.A], sb = segs[q.B];
    if (sa[sa.length - 1] !== q.a) sa = sa.slice().reverse();
    if (sb[0] !== q.b) sb = sb.slice().reverse();
    segs = segs.filter((_, i) => i !== q.A && i !== q.B);
    segs.push([...sa, q.x, ...sb]);
    cross.push(q.x);
  }
  return { segs, cross };
}
// Вышивка номер idx из набора дня. Сначала строим решение (нитки покрывают всё поле), потом ставим пуговки на концы —
// поэтому решение есть всегда.
function makePuzzle(seed, idx) {
  const rnd = mulberry32((seed + idx * 7919) >>> 0);
  const n = sizeOf(idx), want = crossOf(idx);
  let res = null;
  for (let t = 0; t < 400; t++) {
    const segs = cutPath(hamPath(n, rnd), n, rnd);
    if (segs.some(s => adj(s[0], s[s.length - 1], n))) continue;   // концы рядом — слишком просто
    const r = addCross(segs, n, want, rnd);
    if (r.segs.length > NCOL || r.segs.length < 2) continue;
    if (!res || r.cross.length > res.cross.length) res = r;
    if (r.cross.length >= want) break;
  }
  // цвета — в случайном порядке
  const cols = Array.from({ length: NCOL }, (_, i) => i);
  for (let i = cols.length - 1; i > 0; i--) { const j = rnd() * (i + 1) | 0; [cols[i], cols[j]] = [cols[j], cols[i]]; }
  const pairs = res.segs.map((s, k) => ({ a: s[0], b: s[s.length - 1], sol: s, col: cols[k] }));
  return { n, idx, cross: res.cross, pairs };
}
// </logic>

// ---------- День, серия, кошелёк ----------
function dateKey(shift = 0) {
  const d = new Date(); d.setDate(d.getDate() + shift);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function readJSON(k, def) { try { return JSON.parse(localStorage.getItem(KEY(k))) ?? def; } catch (e) { return def; } }
function writeJSON(k, v) { localStorage.setItem(KEY(k), JSON.stringify(v)); }

const Streak = {
  read() { return readJSON('streak', { last: '', n: 0 }); },
  todayCount() { const s = this.read(); return s.last === dateKey() ? s.n : s.last === dateKey(-1) ? s.n + 1 : 1; },
  current() { const s = this.read(); return s.last === dateKey() || s.last === dateKey(-1) ? s.n : 0; },
  playedToday() { return this.read().last === dateKey(); },
  touch() { writeJSON('streak', { last: dateKey(), n: this.todayCount() }); },
  bonusToday() { return this.todayCount() >= ECON.STREAK_DAYS; },
};
const Wallet = {
  get balance() { const v = localStorage.getItem(KEY('wallet')); return v === null ? ECON.START_WALLET : +v; },
  set balance(v) { localStorage.setItem(KEY('wallet'), Math.max(0, Math.round(v))); },
  day() { const d = readJSON('day', null); return d && d.date === dateKey() ? d : { date: dateKey(), free: 0, earned: 0 }; },
  saveDay(d) { writeJSON('day', d); },
  freePerDay() { return ECON.FREE_PER_DAY + (Streak.bonusToday() ? 1 : 0); },
  freeLeft() { return Math.max(0, this.freePerDay() - this.day().free); },
  canPlay() { return this.freeLeft() > 0 || this.balance >= ECON.ENTRY; },
  pay() {
    const d = this.day(); let how = null;
    if (d.free < this.freePerDay()) { d.free++; this.saveDay(d); how = 'free'; }
    else if (this.balance >= ECON.ENTRY) { this.balance -= ECON.ENTRY; how = 'paid'; }
    if (how) Streak.touch();
    return how;
  },
  rewardFor(score) { let p = 0; for (const t of ECON.TIERS) if (score >= t.at) p = t.pay; return p; },
  credit(n) {
    const d = this.day(); const got = Math.max(0, Math.min(n, ECON.DAILY_CAP - d.earned));
    d.earned += got; this.saveDay(d); this.balance += got; return got;
  },
};
const save = {
  get best() { return +localStorage.getItem(KEY('best')) || 0; },
  set best(v) { localStorage.setItem(KEY('best'), v); },
};

// ---------- Цвета ниток (у каждого значок — для тех, кто плохо различает цвета) ----------
const COLS = [
  { c: '#E8623E', name: 'алая' },        // ● круг
  { c: '#6260C6', name: 'фиалка' },      // ▲ треугольник
  { c: '#2FA57F', name: 'мята' },        // ■ квадрат
  { c: '#E9B23A', name: 'золото', ink: 1 }, // ★ звезда
  { c: '#3F8FD6', name: 'синяя' },       // ◆ ромб
  { c: '#D9577E', name: 'роза' },        // ♥ сердце
  { c: '#8B5A3C', name: 'корица' },      // ✚ плюс
  { c: '#1F2742', name: 'чернила' },     // ○ кольцо
  { c: '#86BF3E', name: 'салат', ink: 1 }, // ✕ крестик
  { c: '#8A8FA3', name: 'дым' },         // = две черты
];

// ---------- Стежки (косметика за пуговки) ----------
const STITCHES = [
  { id: 'glad',  name: 'Гладь', free: true },
  { id: 'dash',  name: 'Пунктир' },
  { id: 'zig',   name: 'Ёлочка' },
  { id: 'chain', name: 'Цепочка' },
  { id: 'cross', name: 'Крестик' },
];
const Stitches = {
  owned() { return new Set(readJSON('stitches', ['glad'])); },
  own(id) { const s = this.owned(); s.add(id); writeJSON('stitches', [...s]); },
  get cur() { const id = localStorage.getItem(KEY('stitch')) || 'glad'; return STITCHES.find(t => t.id === id) || STITCHES[0]; },
  set cur(id) { localStorage.setItem(KEY('stitch'), id); },
};

// ---------- Звук (синтез, без файлов) и вибрация ----------
const Sound = {
  ctx: null, on: localStorage.getItem(KEY('sound')) !== '0',
  unlock() {
    if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, d = .12, type = 'sine', vol = .12, at = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + at, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .02);
  },
};
const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
const SFX = {
  step(k) { Sound.tone(PENTA[k % 5] * .5, .05, 'triangle', .04); },
  connect(k) { Sound.tone(PENTA[k % 6], .12, 'triangle', .12); Sound.tone(PENTA[(k % 6) + 2], .14, 'triangle', .1, .07); },
  cut() { Sound.tone(220, .08, 'sawtooth', .04); },
  done() { [0, 2, 4, 7].forEach((k, i) => Sound.tone(PENTA[k], .16, 'triangle', .11, i * .07)); },
  full() { [0, 2, 4, 5, 7, 9].forEach((k, i) => Sound.tone(PENTA[k], .16, 'triangle', .11, i * .06)); },
  skip() { Sound.tone(330, .12, 'sine', .08); Sound.tone(262, .16, 'sine', .08, .08); },
  tick() { Sound.tone(1200, .04, 'square', .03); },
  win() { [0, 2, 4, 5, 7].forEach((k, i) => Sound.tone(PENTA[k], .2, 'triangle', .12, i * .09)); },
  end() { Sound.tone(392, .3, 'triangle', .1); Sound.tone(262, .4, 'triangle', .1, .2); },
};
function buzz(p) { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} }
document.addEventListener('pointerdown', () => Sound.unlock(), true);
function refreshSound() { $('btnSound').textContent = $('btnSound2').textContent = Sound.on ? '🔊' : '🔇'; }
[$('btnSound'), $('btnSound2')].forEach(b => b.onclick = () => {
  Sound.on = !Sound.on; localStorage.setItem(KEY('sound'), Sound.on ? '1' : '0'); refreshSound();
});

// ---------- Экраны и тосты ----------
function show(id) {
  hideHand();
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none');
  if (id === 'menu') renderMenu();
}
function toast(html, ms = 3600) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const d = document.createElement('div'); d.className = 'toast'; d.innerHTML = html; document.body.appendChild(d);
  setTimeout(() => d.classList.add('out'), ms); setTimeout(() => d.remove(), ms + 450);
}

// ---------- Рисование ----------
function shade(hex, k) { // k<0 темнее, k>0 светлее
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
// Значок цвета на пуговке
function drawSym(g, k, x, y, s, col) {
  g.save(); g.fillStyle = col; g.strokeStyle = col; g.lineWidth = s * .42; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  switch (k) {
    case 0: g.arc(x, y, s * .6, 0, 7); g.fill(); break;
    case 1: g.moveTo(x, y - s * .8); g.lineTo(x + s * .8, y + s * .6); g.lineTo(x - s * .8, y + s * .6); g.closePath(); g.fill(); break;
    case 2: g.rect(x - s * .6, y - s * .6, s * 1.2, s * 1.2); g.fill(); break;
    case 3: for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? s * .42 : s * .95; g.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)); } g.closePath(); g.fill(); break;
    case 4: g.moveTo(x, y - s * .9); g.lineTo(x + s * .68, y); g.lineTo(x, y + s * .9); g.lineTo(x - s * .68, y); g.closePath(); g.fill(); break;
    case 5: g.moveTo(x, y + s * .8); g.bezierCurveTo(x - s * 1.15, y - s * .05, x - s * .55, y - s * 1, x, y - s * .38);
      g.bezierCurveTo(x + s * .55, y - s * 1, x + s * 1.15, y - s * .05, x, y + s * .8); g.fill(); break;

// ---------- Игра ----------

}

function draw() {

// ---------- Игровой цикл (браузер сам ставит его на паузу в свёрнутой вкладке) ----------

  G.parts = G.parts.filter(p => p.t < p.life);

    G.timeLeft -= dt;
    if (G.trans <= 0) G.pzT += dt;

function ensureStarted() {
  if (G.started) return;
  G.started = true; onFirstStart();
  if (G.idx === 0 && !G.pz.cross.length) $('gameHint').textContent = '';
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!G || G.over || G.trans > 0) return;
  const c = cellAt(e);
  if (c < 0) return;
  ensureStarted();
  if (!startDrag(c)) return;
  G.drag = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!G || G.drag !== e.pointerId || G.over || G.trans > 0) return;
  e.preventDefault();
  // Небольшая «мёртвая зона» у края клетки, чтобы палец не цеплял соседние клетки по диагонали
  dragTo(cellAt(e));
});
const up = e => { if (!G || G.drag !== e.pointerId) return; G.drag = null; endDrag(); };
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => { if ($('game').classList.contains('active')) e.preventDefault(); }, { passive: false });

$('btnClear').onclick = () => {
  if (!G || G.over || G.trans > 0) return;
  ensureStarted();
  G.paths = G.pz.pairs.map(() => []); G.active = -1; SFX.cut();
};
$('btnSkip').onclick = () => {
  if (!G || G.over || G.trans > 0) return;
  ensureStarted();
  G.skipped++; SFX.skip();
  // Недошитая вышивка не приносит очков — только переход к следующей
  nextPuzzle();
};

function startRun(pending = false) {
  newRun();
  show('game');
  resize(); layout();
  $('score').textContent = '0';
  $('reward').dataset.v = 0; $('reward').innerHTML = `0 ${PG}`;
  updateTimer(RUN_TIME); G.lastTick = RUN_TIME;
  $('gameHint').textContent = 'Веди нитку от пуговки к такой же. Нитки не пересекаются';
  last = 0;
  if (!raf) raf = requestAnimationFrame(loop);
  G.pendingPay = pending;
  setTimeout(maybeHand, 500);
}

function play() {
  const how = Wallet.pay();
  if (!how) { toast(`Не хватает пуговок: забег стоит ${ECON.ENTRY} ${PG}<br>Бесплатная попытка — завтра`); return; }
  startRun();
  if (how === 'paid') toast(`−${ECON.ENTRY} ${PG} за вход`, 1600);
}

function endRun() {
  G.over = true; G.drag = null; G.active = -1;
  // Недошитая вышивка: по 5 очков за каждую соединённую пару
  let partial = 0;
  if (G.trans <= 0) partial = G.paths.filter((_, j) => isDone(j)).length * PARTIAL_PTS;
  if (partial) G.score += partial;
  const sc = G.score;
  const earned = Wallet.credit(Wallet.rewardFor(sc));
  const taskRes = Task.check({ score: sc, solved: G.solved, filled: G.filledN, maxN: G.maxN, skipped: G.skipped });
  const isBest = sc > save.best;
  if (isBest) save.best = sc;
  $('overTitle').textContent = earned > 0 ? 'Красиво вышито! 🎉' : 'Время вышло! ⏱';
  $('overScore').textContent = sc;
  $('overStats').innerHTML = `Вышивок: <b>${G.solved}</b> · всё поле: <b>${G.filledN}</b>` + (G.maxN ? ` · самая большая: <b>${G.maxN}×${G.maxN}</b>` : '')
    + (partial ? `<br>недошитая вышивка: +${partial}` : '')
    + (isBest && sc > 0 ? '<br>🏆 Новый рекорд!' : '');
  $('overTiers').innerHTML = ECON.TIERS.map(t => `<i class="${sc >= t.at ? 'got' : ''}"><b>${t.pay}</b>${t.at}</i>`).join('');
  const next = ECON.TIERS.find(t => sc < t.at), capHit = earned < Wallet.rewardFor(sc);
  $('overNext').innerHTML = capHit ? 'Дневной лимит наград исчерпан — приходите завтра'
    : next ? `До награды ${next.pay} ${PG} не хватило ${next.at - sc} очков` : 'Максимальная награда! 👑';
  const tl = taskLineHTML(taskRes); $('overTask').className = tl.cls; $('overTask').innerHTML = tl.html;
  $('overWallet').textContent = Wallet.balance;
  const again = $('overAgain');
  again.disabled = !Wallet.canPlay();
  again.innerHTML = Wallet.freeLeft() > 0 ? 'Ещё раз · бесплатно' : Wallet.canPlay() ? `Ещё раз · ${ECON.ENTRY} ${PG}` : 'Не хватает пуговок';
  const el = $('overEarn'); el.textContent = '0';
  setTimeout(() => {
    if (!$('game').classList.contains('active')) return;
    $('over').style.display = 'flex';
    if (earned > 0) { SFX.win(); buzz([40, 60, 40, 60, 120]); } else SFX.end();
    let k = 0;
    const id = setInterval(() => { el.textContent = Math.min(++k, earned); if (k >= earned) clearInterval(id); else SFX.tick(); }, 70);
  }, 600);
}

$('btnPlay').onclick = play;
$('overAgain').onclick = play;
$('overMenu').onclick = () => { G = null; show('menu'); };
$('btnBack').onclick = () => { if (G) G.over = true; G = null; show('menu'); };

// ---------- Меню ----------
function renderMenu() {
  $('walletNum').textContent = Wallet.balance;
  const best = save.best;
  $('playSub').innerHTML = `90 секунд · награда в пуговках${best ? ` · рекорд ${best}` : ''}<br>`
    + (Wallet.freeLeft() > 0 ? `<span class="price">🎁 бесплатно сегодня</span>` : `<span class="price">${ECON.ENTRY} ${PG}</span>`);
  const n = Streak.current(), need = ECON.STREAK_DAYS;
  const dots = Array.from({ length: need }, (_, i) => `<i class="${i < Math.min(n, need) ? 'on' : ''}"></i>`).join('');
  const sub = Streak.bonusToday() ? 'сегодня +1 бесплатный забег 🎁'
    : Streak.playedToday() ? `ещё ${need - n} дн. до +1 бесплатного забега` : `сыграй сегодня — до бонуса ${need - n} дн.`;
  $('streakCard').innerHTML = `<div class="dRow"><span class="ic">🔥</span><span>Серия: ${n} дн.<span class="dots3">${dots}</span><small>${sub}</small></span></div>`;
  $('streakCard').innerHTML += taskRowHTML();
  renderStitches();
}
function renderStitches() {
  const owned = Stitches.owned(), cur = Stitches.cur.id;
  $('stitches').innerHTML = STITCHES.map(t => {
    const has = owned.has(t.id);
    return `<button class="stc${t.id === cur ? ' cur' : ''}${has ? '' : ' locked'}" data-id="${t.id}" title="${t.name}">
      <canvas width="92" height="68"></canvas><span class="tag">${has ? t.name : `${ECON.STITCH_PRICE} ${PG}`}</span></button>`;
  }).join('');
  $('stitches').querySelectorAll('.stc').forEach(b => {
    const g = b.querySelector('canvas').getContext('2d');
    drawThread(g, [[14, 50], [46, 50], [46, 18], [80, 18]], COLS[STITCHES.findIndex(s => s.id === b.dataset.id) % 3 ? 1 : 0].c, 36, b.dataset.id);
    b.onclick = () => stitchTap(b.dataset.id, b);
  });
}
function stitchTap(id, btn) {
  const t = STITCHES.find(x => x.id === id);
  if (Stitches.owned().has(id)) { Stitches.cur = id; renderStitches(); toast(`Стежок «${t.name}» выбран`, 1500); return; }
  if (Wallet.balance < ECON.STITCH_PRICE) { toast(`Не хватает пуговок: стежок стоит ${ECON.STITCH_PRICE} ${PG}`); return; }
  if (!btn.classList.contains('confirm')) {
    btn.classList.add('confirm'); btn.querySelector('.tag').textContent = 'Купить?';
    setTimeout(() => { if (btn.isConnected) renderStitches(); }, 3000);
    return;
  }
  Wallet.balance -= ECON.STITCH_PRICE; Stitches.own(id); Stitches.cur = id;
  SFX.done(); buzz([30, 40, 60]);
  renderMenu();
  const w = $('menuWallet'); w.classList.remove('bump'); void w.offsetWidth; w.classList.add('bump');
  toast(`Новый стежок: ${t.name}!`, 1800);
}

$('btnHelp').onclick = () => toast(
  '🧵 Веди пальцем нитку от пуговки к пуговке <b>того же цвета и значка</b>.<br>Нитки не пересекаются — '
  + 'кроме белой пуговицы-перехода: под неё нитка ныряет только прямо.<br>Соедини все пары — вышивка готова, дальше больше. '
  + 'Зашей всё поле — ×1,5. Быстрее — бонус с катушки.', 8000);

// ---------- Правила ----------
function renderRules() {
  const tiers = ECON.TIERS.map(t => `<tr><td>от ${t.at} очков</td><td>${t.pay} ${PG}</td></tr>`).join('');
  $('rulesBody').innerHTML = `
    <div class="rcard"><h3>🧵 Как играть</h3><ul>
      <li>Забег — ${RUN_TIME} секунд. Время пойдёт с первого касания.</li>
      <li>Веди пальцем нитку по клеткам ткани от пуговки к пуговке того же цвета (и значка). Нитки разных цветов не пересекаются — новая нитка перерезает старую.</li>
      <li>Белая пуговица с 4 дырочками — <b>переход</b>: нитка ныряет под неё только прямо, поэтому через неё могут пройти две нитки — вдоль и поперёк.</li>
      <li>Соединил все пары — вышивка готова, следующая больше: 4×4 → 5×5 → … → 8×8.</li>
      <li>«Пропустить» — к следующей вышивке без очков, «Сначала» — убрать все нитки.</li></ul></div>
    <div class="rcard"><h3>✨ Очки</h3><ul>
      <li>Готовая вышивка — <b>${PTS_CELL}</b> очков за каждую клетку (6×6 — 180).</li>
      <li>Всё поле зашито нитками — <b>×${String(FILL_MULT).replace('.', ',')}</b>.</li>
      <li>Катушка — норма времени (6×6 — ${parTime(6)} с): каждая оставшаяся секунда +${SPOOL_PTS}.</li>
      <li>Время вышло — за каждую соединённую пару недошитой вышивки +${PARTIAL_PTS}.</li>
      <li>Набор вышивок — «набор дня», одинаковый для всех, меняется в полночь. У каждой есть решение.</li></ul></div>
    <div class="rcard"><h3>🎯 Задание дня</h3><ul>
      <li>Одно задание в день, одинаковое для всех, — проверяется по итогам забега: +${TASK_REWARD} ${PG} (в пределах дневного лимита).</li></ul></div>
    <div class="rcard"><h3>🎟 Вход</h3><ul>
      <li><b>${ECON.FREE_PER_DAY} бесплатный забег в день</b>, дальше — ${ECON.ENTRY} ${PG}.</li>
      <li>Играешь ${ECON.STREAK_DAYS} дня подряд и дольше — каждый день +1 бесплатный забег.</li></ul></div>
    <div class="rcard"><h3>🏆 Награда — по порогам очков</h3><table>${tiers}</table>
      <ul><li>За сутки — не больше <b>${ECON.DAILY_CAP} ${PG}</b>. Новый день — в полночь по вашему времени.</li></ul></div>
    <div class="rcard"><h3>🪡 Стежки</h3><ul>
      <li>Пунктир, ёлочка, цепочка, крестик — ${ECON.STITCH_PRICE} ${PG} каждый. Только внешний вид, на очки не влияют.</li></ul></div>
    <div class="rcard honest"><h3>🤝 Честно</h3><ul>
      <li>Награда зависит <b>только от очков</b>: никаких случайных выигрышей, лотерей и сундуков.</li>
      <li>У каждого цвета свой значок — играть можно, даже если плохо различаешь цвета.</li>
      <li>Все цены и пороги — на этом экране, во время игры они не меняются.</li></ul></div>`;
}
$('btnRules').onclick = () => { renderRules(); show('rules'); };
$('rulesBack').onclick = () => show('menu');
$('btnReset').onclick = () => {
  const b = $('btnReset');
  if (!b.classList.contains('confirm')) {
    b.classList.add('confirm'); b.textContent = 'Точно сбросить? Нажми ещё раз';
    setTimeout(() => { b.classList.remove('confirm'); b.textContent = '↺ Сбросить демо'; }, 3000);
    return;
  }
  ['wallet', 'day', 'streak', 'stitches', 'stitch', 'best', 'seen', 'hand'].forEach(k => localStorage.removeItem(KEY(k)));
  location.reload();
};

// ---------- Иконка вкладки: пуговка с ниткой ----------
(function icon() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  drawThread(g, [[20, 100], [64, 64], [108, 28]], '#6260C6', 70, 'glad');
  drawEnd(g, 64, 64, 46, 0, false);
  const l = document.createElement('link'); l.rel = 'icon'; l.href = c.toDataURL(); document.head.appendChild(l);
})();

// ---------- Задание дня ----------
// Одно на день, одинаковое для всех (выбирается по дате). Проверяется по итогам забега.
// Награда — TASK_REWARD пуговок, один раз в день, внутри дневного лимита.
const TASK_REWARD = 5;
const TASKS = [
  { text: 'Вышей 4 узора за забег',          ok: s => s.solved >= 4 },
  { text: 'Зашей всё поле в 2 вышивках',     ok: s => s.filled >= 2 },
  { text: 'Вышей узор 6×6',                  ok: s => s.maxN >= 6 },
  { text: 'Набери 700 очков',                ok: s => s.score >= 700 },
  { text: 'Вышей 3 узора без пропусков',     ok: s => s.solved >= 3 && s.skipped === 0 },
];
const Task = {
  today() { let h = 0; for (const ch of 'task-' + dateKey()) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return TASKS[h % TASKS.length]; },
  done() { return !!Wallet.day().task; },
  check(st) {
    const t = this.today();
    if (this.done()) return { t, already: true };
    if (!t.ok(st)) return { t, ok: false };
    const d = Wallet.day(); d.task = true; Wallet.saveDay(d);
    return { t, ok: true, got: Wallet.credit(TASK_REWARD) };
  },
};
function taskRowHTML() {
  const t = Task.today(), done = Task.done();
  return `<div class="dRow${done ? ' ok' : ''}"><span class="ic">${done ? '✅' : '🎯'}</span>
    <span>${t.text}<small>задание дня</small></span><span class="rw">+${TASK_REWARD} ${PG}</span></div>`;
}
function taskLineHTML(r) {
  if (r.already) return { cls: 'taskLine', html: '✅ Задание дня уже выполнено сегодня' };
  if (r.ok) return { cls: 'taskLine ok', html: r.got > 0 ? `✅ Задание дня выполнено: «${r.t.text}» · +${r.got} ${PG}` : `✅ Задание дня выполнено — дневной лимит наград уже набран` };
  return { cls: 'taskLine', html: `🎯 Задание дня: «${r.t.text}» — пока не выполнено` };
}

// ---------- Первый запуск: сразу в игру, рука тянет первую нитку ----------
// Бесплатная попытка списывается только при первом касании — открыл и ушёл в меню, попытка цела.
function onFirstStart() {
  hideHand();
  localStorage.setItem(KEY('hand'), '1');
  if (G && G.pendingPay) { G.pendingPay = false; Wallet.pay(); }
}
function handPath() {
  const r = cv.getBoundingClientRect(), pr = G.pz.pairs[0], s = pr.sol;
  // ведём от пуговки вдоль решения, пока нитка идёт прямо (не больше 3 клеток)
  let j = 1; while (j < s.length - 1 && j < 3 && s[j + 1] - s[j] === s[1] - s[0]) j++;
  const [x0, y0] = center(s[0]), [x1, y1] = center(s[j]);
  return [r.left + x0, r.top + y0 + 14, r.left + x1, r.top + y1 + 14];
}
function maybeHand() {
  if (!G || G.started || localStorage.getItem(KEY('hand')) || !$('game').classList.contains('active')) return;
  const p = handPath(); if (!p) return;
  hideHand();
  const h = document.createElement('div');
  h.id = 'hand'; h.textContent = '👆';
  [['--x0', p[0]], ['--y0', p[1]], ['--x1', p[2]], ['--y1', p[3]]].forEach(([k, v], i) =>
    h.style.setProperty(k, (v - (i % 2 ? 6 : 14)) + 'px'));
  document.body.appendChild(h);
}
function hideHand() { const h = document.getElementById('hand'); if (h) h.remove(); }

refreshSound();
renderMenu();
if (!localStorage.getItem(KEY('seen'))) {
  localStorage.setItem(KEY('seen'), '1');
  if (Wallet.freeLeft() > 0) startRun(true);
}
</script>
