  :root{
    --ink:#1F2742; --accent-text:#6260C6; --accent:#D2D0FF; --accent-bg:#E9E8FF;
    --graphic:#E8623E; --el-bg:#FFF4DF; --page:#FFFDF7; --btn:#FED78C;
    --top:env(safe-area-inset-top, 0px); --bottom:env(safe-area-inset-bottom, 0px);
    --fabric:#E9E8FF; --fabricLine:rgba(98,96,198,.10); --cellBg:rgba(255,253,247,.7);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{background:var(--page);color:var(--ink);overflow:hidden;
    font-family:'Onest',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  .screen{display:none;flex-direction:column;align-items:center;height:100vh;height:100dvh;
    padding:calc(12px + var(--top)) 16px calc(16px + var(--bottom))}
  .screen.active{display:flex}
  button{font:inherit;font-weight:700;font-size:18px;color:var(--ink);background:var(--btn);border:0;
    border-radius:999px;padding:12px 28px;cursor:pointer;transition:transform .1s}
  button:active{transform:scale(.96)}
  button.ghost,.pill,.corner,.tog{background:var(--accent-bg)}
  button[disabled]{opacity:.45}
  .topbar{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;min-height:40px;gap:8px}
  .corner{font-size:14px;padding:8px 14px}
  .tog{font-size:16px;padding:8px 12px}
  .wallet{display:flex;align-items:center;gap:7px;background:var(--el-bg);border-radius:999px;
    padding:7px 14px 7px 9px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;
    box-shadow:inset 0 0 0 1.5px rgba(31,39,66,.06)}
  .wallet.bump{animation:pulse .4s}
  .pg{display:inline-block;width:1em;height:1em;border-radius:50%;vertical-align:-.14em;flex:none;
    background:
      radial-gradient(circle at 37% 37%, #6e2410 0 .07em, transparent .08em),
      radial-gradient(circle at 63% 37%, #6e2410 0 .07em, transparent .08em),
      radial-gradient(circle at 37% 63%, #6e2410 0 .07em, transparent .08em),
      radial-gradient(circle at 63% 63%, #6e2410 0 .07em, transparent .08em),
      radial-gradient(circle, #E8623E 0 .3em, #c74a29 .31em .42em, #E8623E .43em);
    box-shadow:0 .06em 0 rgba(31,39,66,.25)}
  @keyframes pulse{50%{transform:scale(1.25);color:var(--graphic)}}

  /* ---------- Пуговица (CSS). --s — размер, --c — цвет ---------- */
  .bt{--c:#E8623E;--s:60px;width:var(--s);height:var(--s);border-radius:50%;position:relative;flex:none;
    background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.5), transparent 42%), var(--c);
    box-shadow:inset 0 0 0 calc(var(--s) * .075) rgba(0,0,0,.14), 0 calc(var(--s) * .06) 0 rgba(31,39,66,.22)}
  .bt::before{content:'';position:absolute;inset:30%;
    background:radial-gradient(circle, rgba(0,0,0,.5) 0 calc(var(--s) * .055), transparent calc(var(--s) * .066)) 0 0/50% 50%}
  .bt.gold{background:radial-gradient(circle at 34% 28%, #fff8 , transparent 40%),
    conic-gradient(from 30deg, #f6d36b, #E9B23A, #fff1b8, #d99a1e, #f6d36b)}
  .bt.gold::after{content:'👑';position:absolute;left:50%;top:-38%;transform:translateX(-50%);font-size:calc(var(--s) * .42)}

  /* ---------- Меню ---------- */
  #menu{gap:12px;overflow-y:auto;touch-action:pan-y}
  .menuBody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%}
  .ladder{display:flex;align-items:flex-end;gap:6px;height:90px}
  .ladder .bt{animation:bob 2.6s ease-in-out infinite}
  .ladder .ar{font-weight:900;color:var(--accent-text);opacity:.5;margin-bottom:10px}
  @keyframes bob{50%{transform:translateY(-5px)}}
  .title{font-weight:900;font-size:40px;line-height:.95;text-align:center;margin:0}
  .title span{display:block}
  .title .a{color:var(--accent-text)} .title .b{color:#d99a1e}
  .brandSub{font-size:14px;font-weight:600;color:var(--accent-text);margin-top:-4px}
  .big{width:min(290px, 86vw);font-size:24px;padding:16px 0;
    box-shadow:0 6px 0 rgba(31,39,66,.16), 0 0 30px rgba(254,215,140,.7);animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.04)}}
  .big small{display:block;font-size:13px;font-weight:500;opacity:.85}
  .price{display:inline-flex;align-items:center;gap:5px;margin-top:5px;background:rgba(31,39,66,.08);
    border-radius:999px;padding:3px 12px;font-size:14px;font-weight:800}
  .card{background:var(--el-bg);border-radius:16px;padding:10px 14px;width:min(300px, 86vw);font-size:14px;line-height:1.3}
  .card h4{margin:0 0 8px;font-size:13px;font-weight:700;opacity:.6;text-transform:uppercase;letter-spacing:1px}
  .dRow{display:flex;align-items:center;gap:10px}
  .dRow .ic{font-size:20px;width:24px;text-align:center}
  .dRow small{display:block;opacity:.6;font-size:12px}
  .dots3{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}
  .dots3 i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .dots3 i.on{background:var(--graphic)}
  .fabrics{display:flex;gap:6px;justify-content:space-between}
  .fab{width:46px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;padding:0;font-size:11px;font-weight:700}
  .fab .sw{width:34px;height:34px;border-radius:9px;background:
      repeating-linear-gradient(0deg, var(--l) 0 1px, transparent 1px 4px), repeating-linear-gradient(90deg, var(--l) 0 1px, transparent 1px 4px), var(--f);
    box-shadow:inset 0 0 0 1.5px rgba(31,39,66,.12)}
  .fab.cur .sw{outline:2.5px solid var(--accent-text);outline-offset:3px}
  .fab.locked .sw{filter:grayscale(.6) opacity(.55)}
  .fab .tag{display:flex;align-items:center;gap:2px}
  .fab.confirm .tag::before{content:'Купить?';color:var(--graphic);margin-right:2px}
  .menuRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .pill{font-size:15px;padding:10px 18px}

  /* ---------- Игра ---------- */
  #game{gap:6px;padding-left:8px;padding-right:8px}
  header{display:flex;gap:22px;justify-content:center;margin-top:2px}
  .stat{text-align:center}
  .stat span{font-size:12px;opacity:.6;text-transform:uppercase;letter-spacing:1.5px}
  .stat b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat b .pg{width:.75em;height:.75em}
  .stat b.pulse{animation:pulse .35s}
  #timer.hurry{color:var(--graphic)}
  .comboBar{height:24px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
  .comboBar .x{background:var(--accent-text);color:#fff;border-radius:999px;padding:2px 10px}
  .fullBar{width:min(360px, 92vw);height:8px;border-radius:4px;background:var(--accent-bg);overflow:hidden}
  .fullBar i{display:block;height:100%;width:0;background:#35B98F;transition:width .25s, background .25s;border-radius:4px}
  .fullBar.warn i{background:var(--graphic)}
  .fullLabel{font-size:12px;opacity:.6;margin-top:-2px}
  #boardWrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  #board{--cs:62px;display:grid;grid-template-columns:repeat(5, var(--cs));grid-auto-rows:var(--cs);gap:5px;padding:8px;
    border-radius:22px;touch-action:none;position:relative;
    background:repeating-linear-gradient(0deg, var(--fabricLine) 0 1px, transparent 1px 5px),
      repeating-linear-gradient(90deg, var(--fabricLine) 0 1px, transparent 1px 5px), var(--fabric);
    box-shadow:inset 0 0 0 2px rgba(98,96,198,.18), 0 10px 24px rgba(31,39,66,.12)}
  .cell{border-radius:50%;background:var(--cellBg);display:flex;align-items:center;justify-content:center;position:relative;
    box-shadow:inset 0 2px 4px rgba(31,39,66,.08)}
  .cell.sel .bt{transform:scale(1.12);box-shadow:inset 0 0 0 calc(var(--s) * .075) rgba(0,0,0,.14), 0 0 0 4px var(--btn), 0 6px 12px rgba(31,39,66,.25)}
  .cell.match{background:rgba(254,215,140,.85)}
  .cell .bt{transition:transform .12s}
  .cell .bt.new{animation:drop .35s cubic-bezier(.3,1.5,.6,1)}
  @keyframes drop{from{transform:translateY(-40px) scale(.4);opacity:0}}
  .cell .bt.up{animation:up .35s cubic-bezier(.3,1.7,.6,1)}
  @keyframes up{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .cell .bt.leave{animation:leave .5s forwards}
  @keyframes leave{to{transform:translateY(-120px) scale(.3);opacity:0}}
  .cell.dim .bt{opacity:.35}
  #drag{position:fixed;left:0;top:0;z-index:15;pointer-events:none;display:none;filter:drop-shadow(0 8px 10px rgba(31,39,66,.3))}
  .gameHint{font-size:15px;font-weight:600;color:var(--accent-text);text-align:center;min-height:20px;padding:0 10px}
  .float{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:24px;pointer-events:none;z-index:5;
    white-space:nowrap;animation:rise .9s ease-out forwards;color:var(--accent-text);text-shadow:0 2px 0 rgba(255,253,247,.9)}
  .float small{display:block;text-align:center;font-size:14px}
  .float.gold{color:#c98a12;font-size:30px}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,-20%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
    100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}

  /* ---------- Итог ---------- */
  .overlay{position:fixed;inset:0;background:rgba(255,253,247,.96);display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;z-index:20;padding:20px;animation:fadeIn .3s}
  @keyframes fadeIn{from{opacity:0}}
  .overlay h2{margin:0;font-size:32px;text-align:center}
  .res{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--el-bg);border-radius:20px;
    padding:16px 22px;min-width:min(300px, 88vw)}
  .res p{margin:0;font-size:18px}
  .res .sub{font-size:14px;opacity:.7;text-align:center}
  .earn{display:flex;align-items:center;gap:10px;font-size:46px;font-weight:900;color:var(--graphic)}
  .earn .pg{width:44px;height:44px}
  .tiers{display:flex;gap:4px;margin-top:4px}
  .tiers i{display:flex;flex-direction:column;align-items:center;font-style:normal;font-size:11px;opacity:.5;
    background:var(--accent-bg);border-radius:8px;padding:4px 6px;min-width:44px}
  .tiers i b{font-size:14px}
  .tiers i.got{opacity:1;background:var(--accent-text);color:#fff}
  .nextTier{font-size:14px;opacity:.75;text-align:center}
  .walletLine{font-size:15px;opacity:.85;display:flex;align-items:center;gap:6px}
  .row{display:flex;gap:12px}

  /* ---------- Правила ---------- */
  #rules{overflow-y:auto;touch-action:pan-y;height:100vh;height:100dvh}
  #rules h2{margin:14px 0 12px}
  .rulesBody{width:min(420px, 92vw);display:flex;flex-direction:column;gap:10px}
  .rcard{background:var(--el-bg);border-radius:16px;padding:12px 16px;font-size:14px;line-height:1.45}

  .smallHint{opacity:.6;font-size:13px;text-align:center;max-width:300px;margin:8px 0 20px}

  .toast{position:fixed;left:50%;bottom:calc(24px + var(--bottom));transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:12px 18px;border-radius:16px;font-size:15px;line-height:1.4;width:max-content;max-width:88vw;text-align:center;
    z-index:30;pointer-events:none;box-shadow:0 10px 30px rgba(31,39,66,.3);animation:toastIn .35s cubic-bezier(.3,1.5,.6,1)}
  .toast.out{animation:fadeOut .4s forwards}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,20px) scale(.9)}}
  @keyframes fadeOut{to{opacity:0}}

  @media (max-height:660px){
    .ladder{height:64px}
    .title{font-size:32px}
    .big{padding:12px 0;font-size:21px}
    .stat b{font-size:22px}

  /* Рука-подсказка в первом забеге */

    filter:drop-shadow(0 4px 6px rgba(31,39,66,.35));animation:handMove 1.9s ease-in-out infinite}
  #hand.tap{animation:handTap 1.1s ease-in-out infinite}
  @keyframes handMove{0%,10%{transform:translate(var(--x0),var(--y0)) scale(1);opacity:0}
    20%{opacity:1;transform:translate(var(--x0),var(--y0)) scale(.85)}
    70%{transform:translate(var(--x1),var(--y1)) scale(.85);opacity:1}
    90%,100%{transform:translate(var(--x1),var(--y1)) scale(1);opacity:0}}
  @keyframes handTap{0%,100%{transform:translate(var(--x0),var(--y0)) scale(1)}
    45%{transform:translate(var(--x0),var(--y0)) scale(.8)}}

  /* Задание дня */
  .card .dRow + .dRow{margin-top:8px}
  .dRow.ok > span:nth-child(2){opacity:.6;text-decoration:line-through}
  .dRow .rw{margin-left:auto;display:flex;align-items:center;gap:4px;font-weight:800;flex:none}
  .taskLine{font-size:14px;text-align:center;max-width:300px;line-height:1.35}
  .taskLine.ok{color:#2f9a77;font-weight:700}
</style>

<body>

<!-- Меню -->

<div class="screen" id="game">

<div id="drag"></div>

<!-- Правила -->
<div class="screen" id="rules">
  <div class="topbar"><button class="corner" id="rulesBack">← Меню</button><span></span></div>
  <h2>Правила и награды</h2>

<!-- Итог -->
<div class="overlay" id="over">

    <button id="overAgain">Ещё раз</button>
  </div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const PG = '<span class="pg"></span>';
const KEY = k => 'pm-' + k; // своё демо-хранилище у этой игры

// ---------- Экономика ----------
const ECON = {
  START_WALLET: 100,
  FREE_PER_DAY: 1,
  ENTRY: 10,
  // Пороги подобраны симуляцией (400 забегов на тип игрока по набору дня):
  // медиана новичок ~3700, средний ~5700, хороший ~13800, сильный ~17100.
  TIERS: [
    { at: 3500, pay: 2 },
    { at: 6000, pay: 5 },
    { at: 10000, pay: 8 },
    { at: 14500, pay: 12 },
    { at: 18500, pay: 16 },
  ],
  DAILY_CAP: 60,
  STREAK_DAYS: 3,
  FABRIC_PRICE: 10,      // ткань шкатулки — только внешний вид
};
const RUN_TIME = 90;
const SIZE = 5;            // поле 5×5
// Уровни пуговиц: 1 — серая крошка … 6 — золотая
const LEVELS = [
  null,
  { name: 'крошка',   c: '#9aa1b2', k: .42 },
  { name: 'мятная',   c: '#35B98F', k: .52 },
  { name: 'голубая',  c: '#3F9BE0', k: .62 },
  { name: 'фиалка',   c: '#6260C6', k: .72 },
  { name: 'алая',     c: '#E8623E', k: .82 },
  { name: 'золотая',  c: '#E9B23A', k: .9, gold: true },
];
const MAX = 6;
const mergePts = lv => 5 * Math.pow(2, lv);   // слияние в уровень lv: 20, 40, 80, 160, 320
const GOLD_BONUS = 300;                        // золотая уходит в копилку
const COMBO_WINDOW = 1.3;                      // секунд между слияниями для серии
const multFor = combo => 1 + .25 * Math.min(combo, 8);   // до ×3
// Пуговицы падают всё чаще: 1.0 с в начале → 0.5 с к концу.
// Падает больше, чем успевает слить даже сильный игрок, — счёт зависит от его скорости.
const spawnEvery = t => 1.0 - .5 * Math.min(1, t / RUN_TIME);

// ---------- День, серия, кошелёк ----------
function dateKey(shift = 0) {
  const d = new Date(); d.setDate(d.getDate() + shift);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function readJSON(k, def) { try { return JSON.parse(localStorage.getItem(KEY(k))) ?? def; } catch (e) { return def; } }
function writeJSON(k, v) { localStorage.setItem(KEY(k), JSON.stringify(v)); }
const Streak = {
  read() { return readJSON('streak', { last: '', n: 0 }); },
  todayCount() { const s = this.read(); return s.last === dateKey() ? s.n : s.last === dateKey(-1) ? s.n + 1 : 1; },
  current() { const s = this.read(); return s.last === dateKey() || s.last === dateKey(-1) ? s.n : 0; },
  playedToday() { return this.read().last === dateKey(); },
  touch() { writeJSON('streak', { last: dateKey(), n: this.todayCount() }); },
  bonusToday() { return this.todayCount() >= ECON.STREAK_DAYS; },
};
const Wallet = {
  get balance() { const v = localStorage.getItem(KEY('wallet')); return v === null ? ECON.START_WALLET : +v; },
  set balance(v) { localStorage.setItem(KEY('wallet'), Math.max(0, Math.round(v))); },
  day() { const d = readJSON('day', null); return d && d.date === dateKey() ? d : { date: dateKey(), free: 0, earned: 0 }; },
  saveDay(d) { writeJSON('day', d); },
  freePerDay() { return ECON.FREE_PER_DAY + (Streak.bonusToday() ? 1 : 0); },
  freeLeft() { return Math.max(0, this.freePerDay() - this.day().free); },
  canPlay() { return this.freeLeft() > 0 || this.balance >= ECON.ENTRY; },
  pay() {
    const d = this.day(); let how = null;
    if (d.free < this.freePerDay()) { d.free++; this.saveDay(d); how = 'free'; }
    else if (this.balance >= ECON.ENTRY) { this.balance -= ECON.ENTRY; how = 'paid'; }
    if (how) Streak.touch();
    return how;
  },
  rewardFor(score) { let p = 0; for (const t of ECON.TIERS) if (score >= t.at) p = t.pay; return p; },
  credit(n) {
    const d = this.day(); const got = Math.max(0, Math.min(n, ECON.DAILY_CAP - d.earned));
    d.earned += got; this.saveDay(d); this.balance += got; return got;
  },
};
const save = {
  get best() { return +localStorage.getItem(KEY('best')) || 0; },
  set best(v) { localStorage.setItem(KEY('best'), v); },
};

// ---------- Ткани (косметика) ----------
const FABRICS = [
  { id: 'lilac', name: 'Сирень', f: '#E9E8FF', l: 'rgba(98,96,198,.10)', cell: 'rgba(255,253,247,.7)', free: true },
  { id: 'linen', name: 'Лён',    f: '#F1E4CC', l: 'rgba(120,90,50,.10)', cell: 'rgba(255,253,247,.65)' },
  { id: 'mint',  name: 'Мята',   f: '#D7F0E6', l: 'rgba(30,120,90,.10)', cell: 'rgba(255,253,247,.7)' },
  { id: 'denim', name: 'Деним',  f: '#3D5A8A', l: 'rgba(255,255,255,.10)', cell: 'rgba(255,255,255,.18)' },
  { id: 'velvet', name: 'Бархат', f: '#7A2E4A', l: 'rgba(255,255,255,.07)', cell: 'rgba(255,255,255,.14)' },
];
const Fabrics = {
  owned() { return new Set(readJSON('fabrics', ['lilac'])); },
  own(id) { const s = this.owned(); s.add(id); writeJSON('fabrics', [...s]); },
  get cur() { const id = localStorage.getItem(KEY('fabric')) || 'lilac'; return FABRICS.find(s => s.id === id) || FABRICS[0]; },
  set cur(id) { localStorage.setItem(KEY('fabric'), id); applyFabric(); },
};
function applyFabric() {
  const f = Fabrics.cur, r = document.documentElement.style;
  r.setProperty('--fabric', f.f); r.setProperty('--fabricLine', f.l); r.setProperty('--cellBg', f.cell);
}

// ---------- Звук и вибрация ----------
const Sound = {
  ctx: null, on: localStorage.getItem(KEY('sound')) !== '0',
  unlock() {
    if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, d = .12, type = 'sine', vol = .12, at = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + at, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .02);
  },
};
const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
const SFX = {
  pick() { Sound.tone(700, .04, 'triangle', .06); },
  merge(lv, c) { Sound.tone(PENTA[Math.min(lv + c, PENTA.length - 1)], .12, 'triangle', .12); Sound.tone(PENTA[Math.min(lv + c + 2, PENTA.length - 1)], .1, 'sine', .06, .05); },
  gold() { [0, 2, 4, 7, 9].forEach((k, i) => Sound.tone(PENTA[k], .18, 'triangle', .12, i * .07)); },
  drop() { Sound.tone(330, .05, 'sine', .04); },
  bad() { Sound.tone(170, .12, 'sawtooth', .04); },
  tick() { Sound.tone(1200, .04, 'square', .03); },
  win() { [0, 2, 4, 5, 7].forEach((k, i) => Sound.tone(PENTA[k], .2, 'triangle', .12, i * .09)); },
  end() { Sound.tone(392, .3, 'triangle', .1); Sound.tone(262, .4, 'triangle', .1, .2); },
};
function buzz(p) { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} }
document.addEventListener('pointerdown', () => Sound.unlock(), true);
function refreshSound() { $('btnSound').textContent = $('btnSound2').textContent = Sound.on ? '🔊' : '🔇'; }
[$('btnSound'), $('btnSound2')].forEach(b => b.onclick = () => {
  Sound.on = !Sound.on; localStorage.setItem(KEY('sound'), Sound.on ? '1' : '0'); refreshSound();
});

function show(id) {
  hideHand();
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none');
  if (id === 'menu') renderMenu();
}
function toast(html, ms = 3600) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const d = document.createElement('div'); d.className = 'toast'; d.innerHTML = html; document.body.appendChild(d);
  setTimeout(() => d.classList.add('out'), ms); setTimeout(() => d.remove(), ms + 450);
}
function btHTML(lv, cs, cls = '') {
  const L = LEVELS[lv];
  return `<div class="bt${L.gold ? ' gold' : ''}${cls ? ' ' + cls : ''}" style="--c:${L.c};--s:${Math.round(cs * L.k)}px"></div>`;
}

// ---------- Логика (без DOM — её же гоняет симуляция) ----------
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
// Набор дня: уровень и место падения каждой пуговицы задаёт генератор от даты
function newState(seed) {
  const S = { board: Array(SIZE * SIZE).fill(0), rnd: mulberry32(seed), t: 0, nextSpawn: 1.0, score: 0,
    combo: 0, lastMerge: -99, merges: 0, golds: 0, maxLv: 1, over: false, blocked: 0 };
  // Старт: 7 крошек и 2 мятные
  for (let k = 0; k < 9; k++) spawnOne(S, k < 7 ? 1 : 2);
  return S;
}
function emptyCells(S) { const e = []; S.board.forEach((v, i) => { if (!v) e.push(i); }); return e; }
function spawnOne(S, forceLv) {
  const e = emptyCells(S);
  const lv = forceLv || (S.rnd() < .78 ? 1 : 2);
  const r = S.rnd();
  // Места нет — пуговица не падает, но серия сбрасывается
  if (!e.length) { S.blocked++; S.combo = 0; S.lastMerge = -99; return -2; }
  const i = e[Math.floor(r * e.length)];
  S.board[i] = lv;
  return i;
}
// Слияние a → b. Возвращает { lv, pts, gold } или null
function merge(S, a, b) {
  if (a === b || !S.board[a] || S.board[a] !== S.board[b] || S.board[a] >= MAX) return null;
  const lv = S.board[b] + 1;
  S.board[a] = 0; S.board[b] = lv;
  S.combo = S.t - S.lastMerge <= COMBO_WINDOW ? S.combo + 1 : 0;
  S.lastMerge = S.t;
  const m = multFor(S.combo);
  let pts = Math.round(mergePts(lv) * m), gold = false;
  if (lv === MAX) { pts += GOLD_BONUS; S.golds++; gold = true; S.board[b] = 0; }
  S.score += pts; S.merges++; S.maxLv = Math.max(S.maxLv, lv);
  return { lv, pts, gold, m };
}
// Шаг времени: падают новые пуговицы
function tick(S, dt) {
  S.t += dt;
  const dropped = [];
  while (S.t >= S.nextSpawn) {
    const i = spawnOne(S);
    dropped.push(i);
    S.nextSpawn += spawnEvery(S.t);
  }
  return dropped;
}

// ---------- Забег (DOM) ----------
let G = null, CS = 62;
const board = $('board');
function layoutBoard() {
  const wrap = $('boardWrap').getBoundingClientRect();
  CS = Math.floor(Math.min((wrap.width - 16 - 20) / SIZE, (wrap.height - 16 - 20) / SIZE, 84));
  board.style.setProperty('--cs', CS + 'px');
}
function renderBoard(fx = {}) {
  board.innerHTML = G.S.board.map((lv, i) => {
    const cls = fx.drop && fx.drop.includes(i) ? 'new' : fx.up === i ? 'up' : '';
    return `<div class="cell${G.sel === i ? ' sel' : ''}" data-i="${i}">${lv ? btHTML(lv, CS, cls) : ''}</div>`;
  }).join('');
  if (G.sel >= 0) markMatches(G.S.board[G.sel], G.sel);
  const full = G.S.board.filter(Boolean).length / (SIZE * SIZE);
  $('fullBar').querySelector('i').style.width = Math.round(full * 100) + '%';
  $('fullBar').classList.toggle('warn', full >= .8);
  $('fullLabel').textContent = full >= .8 ? '⚠ шкатулка почти полная — сливай!' : `шкатулка заполнена на ${Math.round(full * 100)}%`;
}
function markMatches(lv, except) {
  board.querySelectorAll('.cell').forEach(c => {
    const i = +c.dataset.i, v = G.S.board[i];
    c.classList.toggle('match', i !== except && v === lv && lv < MAX);
    c.classList.toggle('dim', i !== except && v && v !== lv);
  });
}
function cellAt(x, y) {
  const el = document.elementFromPoint(x, y);
  const c = el && el.closest && el.closest('.cell');
  return c ? +c.dataset.i : -1;
}

// Ввод: перетащить пуговицу на такую же — или коснуться одной, потом другой
let drag = null;
board.addEventListener('pointerdown', e => {
  if (!G || G.S.over) return;
  const i = cellAt(e.clientX, e.clientY);
  if (i < 0) return;
  e.preventDefault();
  if (!G.started) { G.started = true; onFirstStart(); $('gameHint').textContent = ''; }
  const lv = G.S.board[i];
  if (G.sel >= 0 && G.sel !== i && lv && G.S.board[G.sel] === lv) {   // второй тап по такой же
    if (tryMerge(G.sel, i)) return;
  }
  if (!lv) { G.sel = -1; renderBoard(); return; }
  G.sel = i; SFX.pick();
  renderBoard();
  board.setPointerCapture(e.pointerId);
  drag = { i, x0: e.clientX, y0: e.clientY, moved: false };
});
board.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8) return;
  const d = $('drag');
  if (!drag.moved) {
    drag.moved = true;
    d.innerHTML = btHTML(G.S.board[drag.i], CS);
    d.style.display = 'block';
    const c = board.querySelector(`.cell[data-i="${drag.i}"] .bt`); if (c) c.style.opacity = '.25';
  }
  const s = Math.round(CS * LEVELS[G.S.board[drag.i]].k);
  d.style.transform = `translate(${e.clientX - s / 2}px, ${e.clientY - s / 2 - 20}px) scale(1.1)`;
});
function endDrag(e) {
  if (!drag) return;
  const dd = drag; drag = null;
  $('drag').style.display = 'none';
  if (!dd.moved) return;                         // это был тап — выбор остаётся
  const j = cellAt(e.clientX, e.clientY - 20);
  if (j >= 0 && j !== dd.i && tryMerge(dd.i, j)) return;
  if (j >= 0 && j !== dd.i && G.S.board[j]) { SFX.bad(); }
  renderBoard();
}
board.addEventListener('pointerup', endDrag);
board.addEventListener('pointercancel', () => { drag = null; $('drag').style.display = 'none'; if (G) renderBoard(); });

function tryMerge(a, b) {
  const lv = G.S.board[a];
  const r = merge(G.S, a, b);
  if (!r) { SFX.bad(); buzz(30); G.sel = G.S.board[b] ? b : -1; renderBoard(); return false; }
  G.sel = -1;
  renderBoard({ up: r.gold ? -1 : b });
  const cell = board.querySelector(`.cell[data-i="${b}"]`);
  if (r.gold) {
    // Золотая на миг появляется и улетает в копилку
    cell.innerHTML = btHTML(MAX, CS, 'leave');
    floatAt(cell, `+${r.pts}`, 'золотая! 👑', 'gold');
    SFX.gold(); buzz([30, 50, 30, 50, 90]);
    $('golds').textContent = G.S.golds;
  } else {
    floatAt(cell, `+${r.pts}`, r.m > 1 ? `×${r.m}` : '', '');
    SFX.merge(lv, Math.min(G.S.combo, 4)); buzz(r.lv >= 4 ? [15, 25, 15] : 12);
  }
  bumpScore();
  renderCombo();
  return true;
}
function floatAt(cell, main, sub, cls) {
  const b = board.getBoundingClientRect(), c = cell.getBoundingClientRect();
  const d = document.createElement('div'); d.className = 'float ' + cls;
  d.style.left = (c.left - b.left + c.width / 2) + 'px'; d.style.top = (c.top - b.top + c.height / 2) + 'px';
  d.innerHTML = main + (sub ? `<small>${sub}</small>` : '');
  board.appendChild(d); setTimeout(() => d.remove(), 900);
}
function bumpScore() {
  const el = $('score'); el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  const r = Wallet.rewardFor(G.S.score), rEl = $('reward');
  if (+rEl.dataset.v !== r) {
    rEl.dataset.v = r; rEl.innerHTML = `${r} ${PG}`;
    if (r > 0) { rEl.classList.remove('pulse'); void rEl.offsetWidth; rEl.classList.add('pulse'); }
  }
}
function renderCombo() {
  const c = G.S.combo;
  $('comboBar').innerHTML = c >= 1 && G.S.t - G.S.lastMerge <= COMBO_WINDOW ? `Серия слияний ${c + 1} <span class="x">×${multFor(c)}</span>` : '';
}
function updateTimer(s) {
  const el = $('timer');
  el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  el.classList.toggle('hurry', s <= 10);
  if (s <= 10 && s > 0) SFX.tick();
}

let last = 0, raf = 0;
function loop(now) {
  raf = requestAnimationFrame(loop);
  if (!G || G.S.over) { last = now; return; }
  const dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
  if (!G.started) return;
  const dropped = tick(G.S, dt);
  if (dropped.includes(-2)) {
    $('gameHint').textContent = '🧺 Места нет — пуговица не упала, серия сброшена';
    clearTimeout(G.hintT); G.hintT = setTimeout(() => { if (G) $('gameHint').textContent = ''; }, 1400);
    SFX.bad(); buzz(40); renderCombo();
  }
  const real = dropped.filter(i => i >= 0);
  if (real.length && !drag) { renderBoard({ drop: real }); SFX.drop(); }
  else if (real.length) { // во время перетаскивания не перерисовываем всё поле
    real.forEach(i => { const c = board.querySelector(`.cell[data-i="${i}"]`); if (c) c.innerHTML = btHTML(G.S.board[i], CS, 'new'); });
  }
  const left = Math.max(0, RUN_TIME - G.S.t), s = Math.ceil(left);
  if (s !== G.lastTick) { G.lastTick = s; updateTimer(s); renderCombo(); }
  if (left <= 0) return endRun('time');
  if (G.shown < G.S.score) { G.shown = Math.min(G.S.score, G.shown + Math.max(1, Math.ceil((G.S.score - G.shown) * .2))); $('score').textContent = G.shown; }
}

function startRun(pending = false) {
  show('game');
  G = { S: newState(hashStr('pm-' + dateKey())), sel: -1, started: false, shown: 0, lastTick: RUN_TIME };
  layoutBoard();
  renderBoard({ drop: G.S.board.map((v, i) => v ? i : -1) });
  $('score').textContent = '0'; $('golds').textContent = '0';
  $('reward').dataset.v = 0; $('reward').innerHTML = `0 ${PG}`;
  updateTimer(RUN_TIME);
  $('comboBar').innerHTML = '';
  $('gameHint').textContent = 'Перетащи пуговицу на такую же — они сольются. Время пойдёт с первого касания';
  last = 0;
  if (!raf) raf = requestAnimationFrame(loop);
  G.pendingPay = pending;
  setTimeout(maybeHand, 500);
}
addEventListener('resize', () => { if (G && $('game').classList.contains('active')) { layoutBoard(); renderBoard(); } });
function play() {
  const how = Wallet.pay();
  if (!how) { toast(`Не хватает пуговок: забег стоит ${ECON.ENTRY} ${PG}<br>Бесплатная попытка — завтра`); return; }
  startRun();
  if (how === 'paid') toast(`−${ECON.ENTRY} ${PG} за вход`, 1600);
}
function endRun(why) {
  G.S.over = true;
  drag = null; $('drag').style.display = 'none';
  $('score').textContent = G.S.score;
  const sc = G.S.score;
  const earned = Wallet.credit(Wallet.rewardFor(sc));
  const taskRes = Task.check({ score: sc, golds: G.S.golds, merges: G.S.merges });
  const isBest = sc > save.best;
  if (isBest) save.best = sc;
  $('overTitle').textContent = earned > 0 ? 'Блестяще! ✨' : 'Время вышло! ⏱';
  $('overScore').textContent = sc;
  $('overStats').innerHTML = `Слияний: <b>${G.S.merges}</b> · золотых: <b>${G.S.golds}</b> · лучший уровень: <b>${LEVELS[G.S.maxLv].name}</b>`
    + (G.S.blocked ? `<br>Не хватило места: ${G.S.blocked} раз` : '')
    + (isBest && sc > 0 ? '<br>🏆 Новый рекорд!' : '');
  $('overTiers').innerHTML = ECON.TIERS.map(t => `<i class="${sc >= t.at ? 'got' : ''}"><b>${t.pay}</b>${t.at}</i>`).join('');
  const next = ECON.TIERS.find(t => sc < t.at), capHit = earned < Wallet.rewardFor(sc);
  $('overNext').innerHTML = capHit ? 'Дневной лимит наград исчерпан — приходите завтра'
    : next ? `До награды ${next.pay} ${PG} не хватило ${next.at - sc} очков` : 'Максимальная награда! 👑';
  const tl = taskLineHTML(taskRes); $('overTask').className = tl.cls; $('overTask').innerHTML = tl.html;
  $('overWallet').textContent = Wallet.balance;
  const again = $('overAgain');
  again.disabled = !Wallet.canPlay();
  again.innerHTML = Wallet.freeLeft() > 0 ? 'Ещё раз · бесплатно' : Wallet.canPlay() ? `Ещё раз · ${ECON.ENTRY} ${PG}` : 'Не хватает пуговок';
  const el = $('overEarn'); el.textContent = '0';
  setTimeout(() => {
    if (!$('game').classList.contains('active')) return;
    $('over').style.display = 'flex';
    if (earned > 0) { SFX.win(); buzz([40, 60, 40, 60, 120]); } else SFX.end();
    let k = 0;
    const id = setInterval(() => { el.textContent = Math.min(++k, earned); if (k >= earned) clearInterval(id); else SFX.tick(); }, 70);
  }, 400);
}
$('btnPlay').onclick = play;
$('overAgain').onclick = play;
$('overMenu').onclick = () => { G = null; show('menu'); };
$('btnBack').onclick = () => { if (G) G.S.over = true; G = null; show('menu'); };

// ---------- Меню ----------
(function ladder() {
  $('ladder').innerHTML = [1, 2, 3, 4, 5, 6].map((lv, k) =>
    (k ? '<span class="ar">›</span>' : '') + btHTML(lv, 58).replace('style="', `style="animation-delay:${-k * .3}s;`)).join('');
})();
function renderMenu() {
  $('walletNum').textContent = Wallet.balance;
  const best = save.best;
  $('playSub').innerHTML = `90 секунд · набор дня${best ? ` · рекорд ${best}` : ''}<br>`
    + (Wallet.freeLeft() > 0 ? `<span class="price">🎁 бесплатно сегодня</span>` : `<span class="price">${ECON.ENTRY} ${PG}</span>`);
  const n = Streak.current(), need = ECON.STREAK_DAYS;
  const dots = Array.from({ length: need }, (_, i) => `<i class="${i < Math.min(n, need) ? 'on' : ''}"></i>`).join('');
  const sub = Streak.bonusToday() ? 'сегодня +1 бесплатный забег 🎁'
    : Streak.playedToday() ? `ещё ${need - n} дн. до +1 бесплатного забега` : `сыграй сегодня — до бонуса ${need - n} дн.`;
  $('streakCard').innerHTML = `<div class="dRow"><span class="ic">🔥</span><span>Серия: ${n} дн.<span class="dots3">${dots}</span><small>${sub}</small></span></div>`;
  $('streakCard').innerHTML += taskRowHTML();
  renderFabrics();
}
function renderFabrics() {
  const owned = Fabrics.owned(), cur = Fabrics.cur.id;
  $('fabrics').innerHTML = FABRICS.map(f => {
    const has = owned.has(f.id);
    return `<button class="fab${f.id === cur ? ' cur' : ''}${has ? '' : ' locked'}" data-id="${f.id}" title="${f.name}">
      <span class="sw" style="--f:${f.f};--l:${f.l}"></span><span class="tag">${has ? f.name : `${ECON.FABRIC_PRICE} ${PG}`}</span></button>`;
  }).join('');
  $('fabrics').querySelectorAll('.fab').forEach(b => b.onclick = () => fabricTap(FABRICS.find(x => x.id === b.dataset.id), b));
}
function fabricTap(f, btn) {
  if (Fabrics.owned().has(f.id)) { Fabrics.cur = f.id; renderFabrics(); toast(`Ткань «${f.name}»`, 1500); return; }
  if (Wallet.balance < ECON.FABRIC_PRICE) { toast(`Не хватает пуговок: стоит ${ECON.FABRIC_PRICE} ${PG}`); return; }
  if (!btn.classList.contains('confirm')) {
    btn.classList.add('confirm');
    setTimeout(() => { if (btn.isConnected) btn.classList.remove('confirm'); }, 3000);
    return;
  }
  Wallet.balance -= ECON.FABRIC_PRICE; Fabrics.own(f.id); Fabrics.cur = f.id;
  SFX.win(); buzz([30, 40, 60]);
  renderMenu();
  const w = $('menuWallet'); w.classList.remove('bump'); void w.offsetWidth; w.classList.add('bump');
  toast(`Новая ткань: ${f.name}!`, 1800);
}
$('btnHelp').onclick = () => toast(
  '✨ Перетащи пуговицу на <b>такую же</b> — они сольются в следующую.<br>Можно и тапами: сначала одну, потом другую.<br>'
  + 'Золотая 👑 уходит в копилку (+300). Сливай быстро подряд — серия до ×3. Новые пуговицы падают всё чаще!', 7500);

// ---------- Правила ----------
function renderRules() {
  const tiers = ECON.TIERS.map(t => `<tr><td>от ${t.at} очков</td><td>${t.pay} ${PG}</td></tr>`).join('');
  const lv = LEVELS.slice(2).map((L, k) => `<tr><td>${btHTML(k + 2, 34)}${L.name}</td><td>${mergePts(k + 2)}${L.gold ? ` + ${GOLD_BONUS}` : ''}</td></tr>`).join('');
  $('rulesBody').innerHTML = `
    <div class="rcard"><h3>✨ Как играть</h3><ul>
      <li>${RUN_TIME} секунд, поле ${SIZE}×${SIZE}. Перетащи пуговицу на такую же (в любом месте поля) — они сольются в следующую.</li>
      <li>Новые пуговицы падают всё чаще. Если места нет — пуговица не падает, но <b>серия сбрасывается</b>.</li>
      <li>Слияния не дольше ${COMBO_WINDOW} с друг за другом — серия: каждое следующее ×0,25, до ×3.</li></ul>
      <table>${lv}</table></div>
    <div class="rcard"><h3>📅 Набор дня</h3><ul>
      <li>Какие пуговицы и куда падают — <b>одинаково для всех</b> в этот день (если играть одинаково).</li></ul></div>
    <div class="rcard"><h3>🎯 Задание дня</h3><ul>
      <li>Одно задание в день, одинаковое для всех, — проверяется по итогам забега: +${TASK_REWARD} ${PG} (в пределах дневного лимита).</li></ul></div>
    <div class="rcard"><h3>🎟 Вход</h3><ul>
      <li><b>${ECON.FREE_PER_DAY} бесплатный забег в день</b>, дальше — ${ECON.ENTRY} ${PG}.</li>
      <li>Играешь ${ECON.STREAK_DAYS} дня подряд и дольше — каждый день +1 бесплатный забег.</li></ul></div>
    <div class="rcard"><h3>🏆 Награда — по порогам очков</h3><table>${tiers}</table>
      <ul><li>За сутки — не больше <b>${ECON.DAILY_CAP} ${PG}</b>. Новый день — в полночь по вашему времени.</li></ul></div>
    <div class="rcard"><h3>🧵 Ткани</h3><ul>
      <li>Другая ткань шкатулки — ${ECON.FABRIC_PRICE} ${PG}. Только внешний вид.</li></ul></div>
    <div class="rcard honest"><h3>🤝 Честно</h3><ul>
      <li>Награда зависит <b>только от очков</b>: никаких случайных выигрышей, лотерей и сундуков.</li>
      <li>Набор пуговиц один на всех — ни у кого нет «удачного» расклада.</li>
      <li>Все цены и пороги — на этом экране, во время игры они не меняются.</li></ul></div>`;
}
$('btnRules').onclick = () => { renderRules(); show('rules'); };
$('rulesBack').onclick = () => show('menu');
$('btnReset').onclick = () => {
  const b = $('btnReset');
  if (!b.classList.contains('confirm')) {
    b.classList.add('confirm'); b.textContent = 'Точно сбросить? Нажми ещё раз';
    setTimeout(() => { b.classList.remove('confirm'); b.textContent = '↺ Сбросить демо'; }, 3000);
    return;
  }
  ['wallet', 'day', 'streak', 'fabrics', 'fabric', 'best', 'seen', 'hand'].forEach(k => localStorage.removeItem(KEY(k)));
  location.reload();
};

// ---------- Иконка вкладки ----------
(function icon() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(26, 22, 4, 32, 34, 28); grd.addColorStop(0, '#fff1b8'); grd.addColorStop(1, '#E9B23A');
  g.fillStyle = grd; g.beginPath(); g.arc(32, 34, 26, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#9a6a10'; [[25, 27], [39, 27], [25, 41], [39, 41]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 3.5, 0, Math.PI * 2); g.fill(); });
  const l = document.createElement('link'); l.rel = 'icon'; l.href = c.toDataURL(); document.head.appendChild(l);
})();

applyFabric();
// ---------- Задание дня ----------
// Одно на день, одинаковое для всех (выбирается по дате). Проверяется по итогам забега.
// Награда — TASK_REWARD пуговок, один раз в день, внутри дневного лимита.
const TASK_REWARD = 5;
const TASKS = [
  { text: 'Собери золотую пуговицу 👑',      ok: s => s.golds >= 1 },
  { text: 'Сделай 55 слияний',              ok: s => s.merges >= 55 },
  { text: 'Две золотые за забег',           ok: s => s.golds >= 2 },
  { text: 'Набери 6000 очков',              ok: s => s.score >= 6000 },
];
const Task = {
  today() { let h = 0; for (const ch of 'task-' + dateKey()) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return TASKS[h % TASKS.length]; },
  done() { return !!Wallet.day().task; },
  check(st) {
    const t = this.today();
    if (this.done()) return { t, already: true };
    if (!t.ok(st)) return { t, ok: false };
    const d = Wallet.day(); d.task = true; Wallet.saveDay(d);
    return { t, ok: true, got: Wallet.credit(TASK_REWARD) };
  },
};
function taskRowHTML() {
  const t = Task.today(), done = Task.done();
  return `<div class="dRow${done ? ' ok' : ''}"><span class="ic">${done ? '✅' : '🎯'}</span>
    <span>${t.text}<small>задание дня</small></span><span class="rw">+${TASK_REWARD} ${PG}</span></div>`;
}
function taskLineHTML(r) {
  if (r.already) return { cls: 'taskLine', html: '✅ Задание дня уже выполнено сегодня' };
  if (r.ok) return { cls: 'taskLine ok', html: r.got > 0 ? `✅ Задание дня выполнено: «${r.t.text}» · +${r.got} ${PG}` : `✅ Задание дня выполнено — дневной лимит наград уже набран` };
  return { cls: 'taskLine', html: `🎯 Задание дня: «${r.t.text}» — пока не выполнено` };
}

// ---------- Первый запуск: сразу в игру, рука показывает, что делать ----------
// Бесплатная попытка списывается только при первом касании — открыл и ушёл в меню, попытка цела.
function onFirstStart() {
  hideHand();
  localStorage.setItem(KEY('hand'), '1');
  if (G && G.pendingPay) { G.pendingPay = false; Wallet.pay(); }
}
function handPath() {
  const b = G.S.board, ones = b.map((v, i) => v === 1 ? i : -1).filter(i => i >= 0);
  if (ones.length < 2) return null;
  const c = i => board.querySelector('.cell[data-i="' + i + '"]').getBoundingClientRect();
  const a = c(ones[0]), z = c(ones[1]);
  return [a.left + a.width / 2, a.top + a.height / 2, z.left + z.width / 2, z.top + z.height / 2];
}
function maybeHand() {
  if (!G || G.started || localStorage.getItem(KEY('hand')) || !$('game').classList.contains('active')) return;
  const p = handPath(); if (!p) return;
  hideHand();
  const h = document.createElement('div');
  h.id = 'hand'; h.textContent = '👆';
  if (p[0] === p[2] && p[1] === p[3]) h.className = 'tap';
  [['--x0', p[0]], ['--y0', p[1]], ['--x1', p[2]], ['--y1', p[3]]].forEach(([k, v], i) =>
    h.style.setProperty(k, (v - (i % 2 ? 6 : 14)) + 'px'));
  document.body.appendChild(h);
}
function hideHand() { const h = document.getElementById('hand'); if (h) h.remove(); }

refreshSound();
renderMenu();
if (!localStorage.getItem(KEY('seen'))) {
  localStorage.setItem(KEY('seen'), '1');
  if (Wallet.freeLeft() > 0) startRun(true);
}
</script>
