  :root{
    --ink:#1F2742; --accent-text:#6260C6; --accent:#D2D0FF; --accent-bg:#E9E8FF;
    --graphic:#E8623E; --el-bg:#FFF4DF; --page:#FFFDF7; --btn:#FED78C;
    --top:env(safe-area-inset-top, 0px); --bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{background:var(--page);color:var(--ink);overflow:hidden;
    font-family:'Onest',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  .screen{display:none;flex-direction:column;align-items:center;height:100vh;height:100dvh;
    padding:calc(12px + var(--top)) 16px calc(16px + var(--bottom))}
  .screen.active{display:flex}
  button{font:inherit;font-weight:700;font-size:18px;color:var(--ink);background:var(--btn);border:0;
    border-radius:999px;padding:12px 28px;cursor:pointer;transition:transform .1s}
  button:active{transform:scale(.96)}
  button.ghost,.pill,.corner,.tog{background:var(--accent-bg)}
  button[disabled]{opacity:.45}
  .topbar{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;min-height:40px;gap:8px}
  .corner{font-size:14px;padding:8px 14px}
  .tog{font-size:16px;padding:8px 12px}
  .wallet{display:flex;align-items:center;gap:7px;background:var(--el-bg);border-radius:999px;
    padding:7px 14px 7px 9px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;
    box-shadow:inset 0 0 0 1.5px rgba(31,39,66,.06)}
  .wallet.bump{animation:pulse .4s}
  /* Пуговица-валюта */
  .pg{display:inline-block;width:1em;height:1em;border-radius:50%;vertical-align:-.14em;flex:none;
    background:
      radial-gradient(circle at 37% 37%, #6e2410 0 .07em, transparent .08em),
      radial-gradient(circle at 63% 37%, #6e2410 0 .07em, transparent .08em),
      radial-gradient(circle at 37% 63%, #6e2410 0 .07em, transparent .08em),
      radial-gradient(circle at 63% 63%, #6e2410 0 .07em, transparent .08em),
      radial-gradient(circle, #E8623E 0 .3em, #c74a29 .31em .42em, #E8623E .43em);
    box-shadow:0 .06em 0 rgba(31,39,66,.25)}
  @keyframes pulse{50%{transform:scale(1.25);color:var(--graphic)}}

  /* ---------- Меню ---------- */
  #menu{justify-content:flex-start;gap:12px;overflow-y:auto;touch-action:pan-y}
  .menuBody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%}
  .hero{width:120px;height:120px;position:relative;animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
  .title{font-weight:900;font-size:42px;line-height:.95;text-align:center;letter-spacing:.3px;margin:0}
  .title span{display:block}
  .title .a{color:var(--graphic)} .title .b{color:var(--accent-text)}
  .brandSub{font-size:14px;font-weight:600;color:var(--accent-text);margin-top:-4px}
  .big{width:min(290px, 86vw);font-size:24px;padding:16px 0;
    box-shadow:0 6px 0 rgba(31,39,66,.16), 0 0 30px rgba(254,215,140,.7);animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.04)}}
  .big small{display:block;font-size:13px;font-weight:500;opacity:.85}
  .price{display:inline-flex;align-items:center;gap:5px;margin-top:5px;background:rgba(31,39,66,.08);
    border-radius:999px;padding:3px 12px;font-size:14px;font-weight:800}
  .card{background:var(--el-bg);border-radius:16px;padding:10px 14px;width:min(300px, 86vw);font-size:14px;line-height:1.3}
  .card h4{margin:0 0 8px;font-size:13px;font-weight:700;opacity:.6;text-transform:uppercase;letter-spacing:1px}
  .dRow{display:flex;align-items:center;gap:10px}
  .dRow .ic{font-size:20px;width:24px;text-align:center}
  .dRow small{display:block;opacity:.6;font-size:12px}
  .dots3{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}
  .dots3 i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .dots3 i.on{background:var(--graphic)}
  .fabrics{display:flex;gap:6px;justify-content:space-between}
  .sw{width:46px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;padding:0;
    font-size:11px;font-weight:700;border-radius:10px;position:relative}
  .sw i{width:38px;height:38px;border-radius:9px;display:block;background-size:19px 19px;
    box-shadow:inset 0 0 0 1px rgba(31,39,66,.15), 0 2px 0 rgba(31,39,66,.15)}
  .sw.cur{outline:2.5px solid var(--accent-text);outline-offset:3px}
  .sw.locked i{filter:grayscale(.55) opacity(.55)}
  .sw .tag{display:flex;align-items:center;gap:2px;white-space:nowrap}
  .sw.confirm .tag::before{content:'Купить?';color:var(--graphic);margin-right:2px}
  .menuRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .pill{font-size:15px;padding:10px 18px}

  /* ---------- Игра ---------- */
  #game{gap:6px}
  header{display:flex;gap:30px;justify-content:center;margin-top:2px}
  .stat{text-align:center}
  .stat span{font-size:12px;opacity:.6;text-transform:uppercase;letter-spacing:1.5px}
  .stat b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat b .pg{width:.75em;height:.75em}
  .stat b.pulse{animation:pulse .35s}
  #timer.hurry{color:var(--graphic)}
  #stage{position:relative;width:100%;max-width:440px;flex:1;min-height:0}
  #cv{position:absolute;inset:0;width:100%;height:100%;border-radius:22px;touch-action:none;cursor:grab}
  #stage.shake{animation:shake .35s}
  @keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
  .comboBar{height:26px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
  .comboBar .x{background:var(--accent-text);color:#fff;border-radius:999px;padding:2px 10px;transition:transform .15s}
  .comboBar .x.up{transform:scale(1.25)}
  .comboBar .lv{display:flex;align-items:center;gap:4px;opacity:.7;font-weight:700}
  .comboBar .lv .pg{width:.9em;height:.9em}
  .gameHint{font-size:15px;font-weight:600;color:var(--accent-text);text-align:center;min-height:40px;display:flex;align-items:center;justify-content:center;line-height:1.25}
  .float{position:absolute;left:50%;transform:translate(-50%,-50%);font-weight:900;font-size:28px;pointer-events:none;
    white-space:nowrap;animation:rise .9s ease-out forwards;color:var(--ink);text-shadow:0 2px 0 rgba(255,253,247,.9);z-index:3}
  .float small{display:block;text-align:center;font-size:15px}
  .float.good{color:var(--accent-text)} .float.perfect{color:var(--graphic)} .float.miss{color:#7d8399}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,-20%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
    100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}

  /* ---------- Итог ---------- */
  .overlay{position:fixed;inset:0;background:rgba(255,253,247,.95);display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;z-index:20;padding:20px;animation:fadeIn .3s}
  @keyframes fadeIn{from{opacity:0}}
  .overlay h2{margin:0;font-size:32px;text-align:center}
  .res{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--el-bg);border-radius:20px;
    padding:16px 22px;min-width:min(300px, 88vw)}
  .res p{margin:0;font-size:18px}
  .res .sub{font-size:14px;opacity:.7;text-align:center}
  .earn{display:flex;align-items:center;gap:10px;font-size:46px;font-weight:900;color:var(--graphic)}
  .earn .pg{width:44px;height:44px}
  /* Разбивка «за что заплачено» */
  .bill{width:100%;border-collapse:collapse;font-size:14px;margin-top:2px}
  .bill td{padding:3px 0;vertical-align:baseline}
  .bill td:last-child{text-align:right;font-weight:800;white-space:nowrap;padding-left:10px}
  .bill td .pg{width:.95em;height:.95em}
  .bill tr.muted{opacity:.55}
  .bill tr.cap td{color:var(--graphic);font-weight:700}
  .bill tr.tot td{border-top:1px dashed rgba(31,39,66,.25);padding-top:6px;font-weight:800}
  .nextTier{font-size:14px;opacity:.75;text-align:center}
  .walletLine{font-size:15px;opacity:.85;display:flex;align-items:center;gap:6px}
  .row{display:flex;gap:12px}

  /* ---------- Правила ---------- */
  #rules{overflow-y:auto;touch-action:pan-y;height:100vh;height:100dvh}
  #rules h2{margin:14px 0 12px}
  .rulesBody{width:min(420px, 92vw);display:flex;flex-direction:column;gap:10px}
  .rcard{background:var(--el-bg);border-radius:16px;padding:12px 16px;font-size:14px;line-height:1.45}
  .rcard h3{margin:0 0 6px;font-size:17px;color:var(--accent-text)}
  .rcard ul{margin:0;padding-left:18px}
  .rcard table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
  .rcard td{padding:3px 0;border-bottom:1px solid rgba(31,39,66,.1)}
  .rcard td:last-child{text-align:right;font-weight:800}
  .rcard.honest{background:var(--accent-bg)}
  .resetBtn{font-size:14px;padding:9px 18px;margin-top:16px}
  .resetBtn.confirm{background:var(--graphic);color:#fff}
  .smallHint{opacity:.6;font-size:13px;text-align:center;max-width:300px;margin:8px 0 20px}
  .kinds{display:flex;gap:10px;justify-content:center;margin:8px 0 2px}
  .kinds canvas{width:64px;height:64px}

  /* ---------- Тост ---------- */
  .toast{position:fixed;left:50%;bottom:calc(24px + var(--bottom));transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:12px 18px;border-radius:16px;font-size:15px;line-height:1.4;width:max-content;max-width:88vw;text-align:center;
    z-index:30;pointer-events:none;box-shadow:0 10px 30px rgba(31,39,66,.3);animation:toastIn .35s cubic-bezier(.3,1.5,.6,1)}
  .toast.out{animation:fadeOut .4s forwards}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,20px) scale(.9)}}
  @keyframes fadeOut{to{opacity:0}}

  @media (max-height:640px){
    .hero{width:84px;height:84px}
    .title{font-size:34px}
    .big{padding:12px 0;font-size:21px}
    .stat b{font-size:22px}
  }

  /* Рука-подсказка в первом забеге */
  #hand{position:fixed;left:0;top:0;font-size:42px;z-index:25;pointer-events:none;
    filter:drop-shadow(0 4px 6px rgba(31,39,66,.35));animation:handMove 1.9s ease-in-out infinite}
  #hand.tap{animation:handTap 1.1s ease-in-out infinite}
  @keyframes handMove{0%,10%{transform:translate(var(--x0),var(--y0)) scale(1);opacity:0}
    20%{opacity:1;transform:translate(var(--x0),var(--y0)) scale(.85)}
    70%{transform:translate(var(--x1),var(--y1)) scale(.85);opacity:1}

<script>
'use strict';
// ==ЛОГИКА== (без DOM — её же прогоняет симуляция баланса)
// Все расстояния — в долях ширины поля; поле всегда 1 × HB, так что сложность не зависит от экрана.
const RUN_TIME = 75;        // секунд
const HB = 1.45;            // высота поля в ширинах
const ENTER_Y = 1.10;       // петля выезжает из-под лотка
const MISS_Y = .06;         // петля выше этой линии — уехала
const EARLY_Y = .62;        // застегнул ниже этой линии — «быстро!» (+10)
const TRAY_Y = 1.30, TRAY_X = [.19, .5, .81];
const GRAB_R = .15;         // радиус захвата пуговки в лотке
const DROP_R = .13;         // насколько точно надо попасть в петлю
const MISS_PENALTY = 2;     // секунды за уехавшую петлю
const JACKET_BONUS = 100;   // вся куртка застёгнута
const FF = 3.2;             // все петли застёгнуты — лента едет быстрее во столько раз
const R_BIG = .086, R_SMALL = .056;
// Вид пуговки = форма×2 + маленькая. Форма различима и без цвета: круг·4 дырочки, квадрат·2, цветок·3
const SHAPES = [
  { name: 'круглая',    holes: 4, color: '#E8623E' },
  { name: 'квадратная', holes: 2, color: '#6260C6' },
  { name: 'цветок',     holes: 3, color: '#E9B23A' },
];
const tShape = t => t >> 1, tSmall = t => (t & 1) === 1, tR = t => tSmall(t) ? R_SMALL : R_BIG;

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

const levelSpeed = k => Math.min(.40, .12 * Math.pow(1.14, k));   // скорость ленты, ширин/с
const mult = c => Math.min(5, 1 + Math.floor(c / 5));             // каждые 5 подряд — +1, до ×5
// Куртка 1 — две формы, 2 — три, с 3-й — ещё и большие/маленькие
const allowedTypes = k => k === 0 ? [0, 2] : k === 1 ? [0, 2, 4] : [0, 1, 2, 3, 4, 5];

function makeJacket(S, top) {
  const k = S.made++, r = S.rj, types = allowedTypes(k);
  const n = Math.min(7, 5 + (k >= 2 ? 1 : 0) + (k >= 4 ? 1 : 0));
  const gap = Math.max(.27, .34 - k * .012);
  const holes = []; let prev = -1;
  for (let i = 0; i < n; i++) {
    let t = types[Math.floor(r() * types.length)];
    if (t === prev && r() < .6) t = types[Math.floor(r() * types.length)];
    prev = t; holes.push({ dy: .3 + i * gap, type: t, st: 0, at: 0 }); // st: 0 открыта, 1 застёгнута, 2 уехала
  }
  return { k, top, len: .3 + (n - 1) * gap + .32, holes, done: 0, left: n,
    sway: k >= 3 ? Math.min(.12, (k - 2) * .04) : 0, ph: r() * 6 };
}
const holeY = (j, h) => j.top + h.dy;
const holeX = (S, j) => .5 + j.sway * Math.sin(S.t * 1.3 + j.ph);

function newState(seed) {
  const S = { rj: mulberry32(seed), rt: mulberry32(seed ^ 0x5bd1e995), made: 0, jk: [], tray: [-1, -1, -1], held: -1,
    t: 0, timeLeft: RUN_TIME, started: false, over: false, v: levelSpeed(0), score: 0, combo: 0, bestCombo: 0,
    buttoned: 0, wrong: 0, missed: 0, full: 0, early: 0, orders: [], rejected: 0, ev: [] };
  S.jk.push(makeJacket(S, .42));       // первая петля сразу на виду
  addJackets(S);
  ensureTray(S);
  S.ev.length = 0;
  return S;
}
function addJackets(S) {
  let l = S.jk[S.jk.length - 1];
  while (l.top + l.len < HB + 1) { l = makeJacket(S, l.top + l.len + .22); S.jk.push(l); }
  while (S.jk.length > 1 && S.jk[0].top + S.jk[0].len < -4) S.jk.shift();
}
const curJacket = S => S.jk.find(j => j.left > 0) || S.jk[S.jk.length - 1];
function openHoles(S) {        // открытые петли над лотком
  const out = [];
  for (const j of S.jk) for (const h of j.holes) if (!h.st) { const y = holeY(j, h); if (y < ENTER_Y) out.push({ j, h, x: holeX(S, j), y }); }
  return out;
}
function needTypes(S, n = 2) { // виды для ближайших n открытых петель
  const out = [];
  for (const j of S.jk) for (const h of j.holes) if (!h.st && out.length < n) out.push(h.type);
  return [...new Set(out)];
}
// В лотке всегда есть пуговки для двух ближайших петель; третья — «похожая» или случайная
function ensureTray(S) {
  const need = needTypes(S);
  for (const t of need) {
    if (S.tray.includes(t)) continue;
    let i = S.tray.indexOf(-1);
    if (i < 0) i = S.tray.findIndex((x, k) => k !== S.held && !need.includes(x));
    if (i >= 0) { S.tray[i] = t; S.ev.push({ e: 'pop', slot: i }); }
  }
  for (let i = 0; i < 3; i++) if (S.tray[i] < 0) {
    const k = curJacket(S).k, types = allowedTypes(k), r = S.rt;
    S.tray[i] = k >= 2 && need.length && r() < .55 ? need[0] ^ 1 : types[Math.floor(r() * types.length)];
    S.ev.push({ e: 'pop', slot: i });
  }
}
function jacketCheck(S, j) {
  if (j.left > 0) return;
  if (j.done === j.holes.length) { S.full++; S.orders.push(j.k); S.score += JACKET_BONUS; S.ev.push({ e: 'jacket', j, pay: orderPrice(j.k) }); }
  else { S.rejected++; S.ev.push({ e: 'jacketPart', j }); }
}
function tick(S, dt) {
  if (!S.started || S.over) return;
  S.t += dt; S.timeLeft -= dt;
  const open = openHoles(S);
  const target = levelSpeed(curJacket(S).k) * (open.length ? 1 : FF);
  S.v += (target - S.v) * Math.min(1, dt * 5);
  for (const j of S.jk) j.top -= S.v * dt;
  for (const j of S.jk) for (const h of j.holes) if (!h.st && holeY(j, h) < MISS_Y) {
    h.st = 2; h.at = S.t; j.left--; S.missed++; S.combo = 0;
    S.timeLeft -= MISS_PENALTY;
    S.ev.push({ e: 'miss', x: holeX(S, j), y: holeY(j, h) });
    jacketCheck(S, j); ensureTray(S);
  }
  addJackets(S);
  if (S.timeLeft <= 0) { S.timeLeft = 0; S.over = true; }
}
function holeAt(S, x, y, r = DROP_R) {
  let best = null, bd = r;
  for (const o of openHoles(S)) { const d = Math.hypot(o.x - x, o.y - y); if (d <= bd) { bd = d; best = o; } }
  return best;
}
// Пуговку из лотка (slot) отпустили в точке x, y
function tryDrop(S, slot, x, y) {
  if (S.over || slot < 0 || S.tray[slot] < 0) return { r: 'none' };
  const o = holeAt(S, x, y);
  if (!o) return { r: 'none' };
  if (S.tray[slot] !== o.h.type) { S.combo = 0; S.wrong++; return { r: 'wrong', o }; }
  const m = mult(S.combo), early = o.y > EARLY_Y, pts = (10 + (early ? 10 : 0)) * m;
  o.h.st = 1; o.h.at = S.t; o.j.done++; o.j.left--;
  S.combo++; S.bestCombo = Math.max(S.bestCombo, S.combo); S.buttoned++; if (early) S.early++;
  S.score += pts; S.tray[slot] = -1;
  jacketCheck(S, o.j); ensureTray(S);
  return { r: 'ok', o, pts, early, m };
}
// ---------- Экономика: все числа в одном месте (их же — в записке и на экране правил) ----------
const ECON = {
  START_WALLET: 100,   // демо-баланс
  FREE_PER_DAY: 1,     // бесплатных забегов в день
  ENTRY: 10,           // платный забег
  // Оплата за заказ: каждая куртка, застёгнутая ЦЕЛИКОМ, — оплаченный заказ. Цена — по номеру куртки:
  // дальше куртка (быстрее лента, больше петель) — дороже заказ. Куртка с уехавшей петлёй не принимается.
  // Прейскурант подобран симуляцией; после последней цены — та же цена.
  ORDER_PRICE: [1, 1, 1, 1, 1, 1, 2, 2, 3, 3, 4],
  RUN_CAP: 20,         // потолок оплаты за один забег (живой игрок до него не доходит, защищает от ботов)
  DAILY_CAP: 60,       // больше этого за сутки не начисляем
  STREAK_DAYS: 3,      // играешь N дней подряд — +1 бесплатный забег в день
  FABRIC_PRICE: 10,    // ткань куртки — только внешний вид
};
// Цена заказа за куртку №(k+1)
const orderPrice = k => ECON.ORDER_PRICE[Math.min(k, ECON.ORDER_PRICE.length - 1)];
// Итог забега → выплата: строки «за что заплачено» (куртки сгруппированы по цене заказа)
function rewardOf(S) {
  const lines = [];
  for (const k of S.orders) {
    const each = orderPrice(k), l = lines.find(x => x.each === each);
    if (l) { l.qty++; l.sum += each; l.nums.push(k + 1); } else lines.push({ each, qty: 1, sum: each, nums: [k + 1] });
  }
  // Номера курток отрезками: 1–3, 5–6 (пропуск — куртка не принята)
  lines.forEach(l => {
    const parts = [];
    for (const n of l.nums) { const p = parts[parts.length - 1]; if (p && p[1] === n - 1) p[1] = n; else parts.push([n, n]); }
    l.label = (l.qty > 1 ? 'куртки №' : 'куртка №') + parts.map(([x, y]) => x === y ? x : y === x + 1 ? `${x}, ${y}` : `${x}–${y}`).join(', ');
  });
  const sum = lines.reduce((a, l) => a + l.sum, 0);
  return { total: Math.min(ECON.RUN_CAP, sum), sum, lines, rejected: S.rejected };
}
// Цена ближайшего заказа, который ещё можно получить: текущая куртка, если на ней ничего не уехало, иначе следующая
function nextOrderPrice(S) {
  const j = curJacket(S), spoiled = j.holes.some(h => h.st === 2);
  return { k: spoiled ? j.k + 1 : j.k, price: orderPrice(spoiled ? j.k + 1 : j.k) };
}
// ==КОНЕЦ ЛОГИКИ==

const $ = id => document.getElementById(id);
const PG = '<span class="pg"></span>';
const KEY = k => 'pku-' + k; // у каждой игры своё демо-хранилище

// ---------- День, серия, кошелёк ----------
function dateKey(shift = 0) {
  const d = new Date(); d.setDate(d.getDate() + shift);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function readJSON(k, def) { try { return JSON.parse(localStorage.getItem(KEY(k))) ?? def; } catch (e) { return def; } }
function writeJSON(k, v) { localStorage.setItem(KEY(k), JSON.stringify(v)); }

const Streak = {
  read() { return readJSON('streak', { last: '', n: 0 }); },
  todayCount() { const s = this.read(); return s.last === dateKey() ? s.n : s.last === dateKey(-1) ? s.n + 1 : 1; },
  current() { const s = this.read(); return s.last === dateKey() || s.last === dateKey(-1) ? s.n : 0; },
  playedToday() { return this.read().last === dateKey(); },
  touch() { writeJSON('streak', { last: dateKey(), n: this.todayCount() }); },
  bonusToday() { return this.todayCount() >= ECON.STREAK_DAYS; },
};
const Wallet = {
  get balance() { const v = localStorage.getItem(KEY('wallet')); return v === null ? ECON.START_WALLET : +v; },
  set balance(v) { localStorage.setItem(KEY('wallet'), Math.max(0, Math.round(v))); },
  day() { const d = readJSON('day', null); return d && d.date === dateKey() ? d : { date: dateKey(), free: 0, earned: 0 }; },
  saveDay(d) { writeJSON('day', d); },
  freePerDay() { return ECON.FREE_PER_DAY + (Streak.bonusToday() ? 1 : 0); },
  freeLeft() { return Math.max(0, this.freePerDay() - this.day().free); },
  canPlay() { return this.freeLeft() > 0 || this.balance >= ECON.ENTRY; },
  pay() {
    const d = this.day(); let how = null;
    if (d.free < this.freePerDay()) { d.free++; this.saveDay(d); how = 'free'; }
    else if (this.balance >= ECON.ENTRY) { this.balance -= ECON.ENTRY; how = 'paid'; }
    if (how) Streak.touch();
    return how;
  },
  credit(n) {
    const d = this.day(); const got = Math.max(0, Math.min(n, ECON.DAILY_CAP - d.earned));
    d.earned += got; this.saveDay(d); this.balance += got; return got;
  },
};
const save = {
  get best() { return +localStorage.getItem(KEY('best')) || 0; },
  set best(v) { localStorage.setItem(KEY('best'), v); },
};

// ---------- Ткани куртки (косметика за пуговки) ----------
// Плитка ткани рисуется на маленьком canvas: ею заливается куртка и образец в меню
const FABRICS = [
  { id: 'denim',  name: 'Деним',   base: '#3F6FA8', free: true, kind: 'twill' },
  { id: 'mustard', name: 'Горчица', base: '#C9962E', kind: 'cord' },
  { id: 'tartan', name: 'Клетка',  base: '#B8463A', kind: 'check' },
  { id: 'khaki',  name: 'Хаки',    base: '#6E7F4E', kind: 'rip' },
  { id: 'velvet', name: 'Бархат',  base: '#5B4A9E', kind: 'velvet' },
];
function fabricTile(f) {
  const c = document.createElement('canvas'); c.width = c.height = 24;
  const g = c.getContext('2d');
  g.fillStyle = f.base; g.fillRect(0, 0, 24, 24);
  if (f.kind === 'twill') {
    g.strokeStyle = 'rgba(255,255,255,.13)'; g.lineWidth = 1.4;
    for (let i = -24; i < 48; i += 4) { g.beginPath(); g.moveTo(i, 24); g.lineTo(i + 24, 0); g.stroke(); }
  } else if (f.kind === 'cord') {
    for (let x = 0; x < 24; x += 6) { g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(x, 0, 2, 24); g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(x + 3, 0, 2, 24); }
  } else if (f.kind === 'check') {
    g.fillStyle = 'rgba(31,39,66,.28)'; g.fillRect(0, 8, 24, 6); g.fillRect(8, 0, 6, 24);
    g.fillStyle = 'rgba(255,230,160,.35)'; g.fillRect(0, 19, 24, 1.5); g.fillRect(19, 0, 1.5, 24);
  } else if (f.kind === 'rip') {
    g.strokeStyle = 'rgba(0,0,0,.14)'; g.lineWidth = 1;
    for (let i = 0; i <= 24; i += 8) { g.beginPath(); g.moveTo(i + .5, 0); g.lineTo(i + .5, 24); g.moveTo(0, i + .5); g.lineTo(24, i + .5); g.stroke(); }
  } else {
    const gr = g.createLinearGradient(0, 0, 24, 24);
    gr.addColorStop(0, 'rgba(255,255,255,.14)'); gr.addColorStop(.5, 'rgba(0,0,0,.08)'); gr.addColorStop(1, 'rgba(255,255,255,.14)');
    g.fillStyle = gr; g.fillRect(0, 0, 24, 24);
  }
  return c;
}
FABRICS.forEach(f => { f.tile = fabricTile(f); f.url = f.tile.toDataURL(); });
const Fabrics = {
  owned() { return new Set(readJSON('fabrics', ['denim'])); },
  own(id) { const s = this.owned(); s.add(id); writeJSON('fabrics', [...s]); },
  get cur() { const id = localStorage.getItem(KEY('fabric')) || 'denim'; return FABRICS.find(t => t.id === id) || FABRICS[0]; },
  set cur(id) { localStorage.setItem(KEY('fabric'), id); },
};

// ---------- Звук (синтез, без файлов) и вибрация ----------
const Sound = {
  ctx: null, on: localStorage.getItem(KEY('sound')) !== '0',
  unlock() {
    if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, d = .12, type = 'sine', vol = .12, at = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + at, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d + .02);
  },
};
const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
const SFX = {
  pick() { Sound.tone(700, .05, 'triangle', .07); },
  snap(c) { Sound.tone(PENTA[Math.min(c, PENTA.length - 1)], .1, 'triangle', .13); Sound.tone(2200, .03, 'square', .03); },
  early(c) { SFX.snap(c); Sound.tone(PENTA[Math.min(c + 2, PENTA.length - 1)] * 2, .1, 'sine', .07, .05); },
  wrong() { Sound.tone(190, .14, 'square', .06); Sound.tone(150, .16, 'square', .05, .08); },
  miss() { Sound.tone(150, .2, 'sawtooth', .06); },
  jacket() { [0, 2, 4, 7, 9].forEach((k, i) => Sound.tone(PENTA[k], .16, 'triangle', .11, i * .06)); },
  tick() { Sound.tone(1200, .04, 'square', .03); },
  win() { [0, 2, 4, 5, 7].forEach((k, i) => Sound.tone(PENTA[k], .2, 'triangle', .12, i * .09)); },

    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ---------- Игровой цикл (браузер сам останавливает его в свёрнутой вкладке — время на паузе) ----------
let last = 0, raf = 0;
function loop(now) {
  raf = requestAnimationFrame(loop);
  if (!G) return;
  const dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
  const S = G.S;
  if (!S.over) tick(S, dt);
  G.pop = G.pop.map(p => p + dt);
  G.anims.forEach(a => a.t += dt); G.anims = G.anims.filter(a => a.t < a.dur);
  G.parts.forEach(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; });
  G.parts = G.parts.filter(p => p.t < p.life);
  G.hover = null;
  if (G.drag && G.drag.moved) { const o = holeAt(S, G.drag.x, G.drag.y - LIFT); if (o) G.hover = o.h; }
  handleEvents();
  if (G.started && !G.over) {
    const s = Math.ceil(Math.max(0, S.timeLeft));
    if (s !== G.lastTick) { G.lastTick = s; updateTimer(s); }
    if (S.over) endRun();
  }
  if (G.shown < S.score) { G.shown = Math.min(S.score, G.shown + Math.max(1, Math.ceil((S.score - G.shown) * .2))); $('score').textContent = G.shown; }
  draw();
}
function updateTimer(s) {
  const el = $('timer');
  el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  el.classList.toggle('hurry', s <= 10);
  if (s <= 10 && s > 0 && G && G.started) SFX.tick();
}
document.addEventListener('visibilitychange', () => { last = 0; if (G) { G.drag = null; G.S.held = -1; } });

function startRun(pending = false) {
  newRun();
  show('game');
  resize();
  $('score').textContent = '0';
  $('reward').innerHTML = `+0 ${PG}`;
  updateTimer(RUN_TIME);
  renderCombo();
  $('gameHint').textContent = 'Тяни пуговку из лотка в петлю с таким же силуэтом';
  last = 0;
  if (!raf) raf = requestAnimationFrame(loop);
  G.pendingPay = pending;
  setTimeout(maybeHand, 500);
}

// Вход (бесплатный или платный) списывается при первом касании забега (onFirstStart):
// открыл забег и вышел в меню до касания — ничего не списано
function play() {
  if (G && !G.over && $('game').classList.contains('active')) return; // двойное нажатие: забег уже открыт
  if (!Wallet.canPlay()) { toast(`Не хватает пуговок: забег стоит ${ECON.ENTRY} ${PG}<br>Бесплатная попытка — завтра`); return; }
  startRun(true);
}

function endRun() {
  if (G.over) return;
  G.over = true; G.drag = null;
  const S = G.S, sc = S.score;
  const rw = rewardOf(S), earned = Wallet.credit(rw.total);
  const taskRes = Task.check({ score: sc, buttoned: S.buttoned, full: S.full, bestCombo: S.bestCombo, early: S.early });
  const isBest = sc > save.best;
  if (isBest) save.best = sc;
  $('overTitle').textContent = earned > 0 ? 'Заказы оплачены! 🎉' : 'Время вышло! ⏱';
  $('overScore').textContent = sc;
  $('overStats').innerHTML = `Пуговок: <b>${S.buttoned}</b> · лучшая серия: <b>${S.bestCombo}</b>`
    + `<br>не та пуговка: <b>${S.wrong}</b> · уехало петель: <b>${S.missed}</b>`
    + (isBest && sc > 0 ? '<br>🏆 Новый рекорд!' : '');
  $('overBill').innerHTML = billHTML(rw, earned);
  const nx = nextOrderPrice(S);
  $('overNext').innerHTML = earned < rw.total ? 'Дневной лимит начислений набран — приходите завтра'
    : rw.sum >= ECON.RUN_CAP ? 'Потолок за забег набран — лучше не бывает! 👑'
    : rw.lines.length ? `Ещё одна целая куртка (№${nx.k + 1}) — +${nx.price} ${PG}`
    : `Застегни куртку целиком, чтобы ни одна петля не уехала, — +${orderPrice(0)} ${PG}`;
  const tl = taskLineHTML(taskRes); $('overTask').className = tl.cls; $('overTask').innerHTML = tl.html;
  $('overWallet').textContent = Wallet.balance;
  const again = $('overAgain');
  again.disabled = !Wallet.canPlay();
  again.innerHTML = Wallet.freeLeft() > 0 ? 'Ещё раз · бесплатно' : Wallet.canPlay() ? `Ещё раз · ${ECON.ENTRY} ${PG}` : 'Не хватает пуговок';
  const el = $('overEarn'); el.textContent = '0';
  const runG = G; // итог показываем только для этого забега (игрок мог уйти и начать новый)
  setTimeout(() => {
    if (G !== runG || !$('game').classList.contains('active')) return;
    $('over').style.display = 'flex';
    if (earned > 0) { SFX.win(); buzz([40, 60, 40, 60, 120]); } else SFX.end();
    let k = 0;
    const id = setInterval(() => { el.textContent = Math.min(++k, earned); if (k >= earned || $('over').style.display !== 'flex') clearInterval(id); else SFX.tick(); }, 70);
  }, 500);
}
// Разбивка «за что заплачено»: строки rewardOf + не принятые куртки + дневной лимит
function billHTML(rw, earned) {
  const rows = rw.lines.map(l => `<tr><td>${l.label}</td><td>${l.qty} × ${l.each} = ${l.sum} ${PG}</td></tr>`);
  if (!rw.lines.length) rows.push(`<tr class="muted"><td>целых курток нет</td><td>0 ${PG}</td></tr>`);
  if (rw.rejected) rows.push(`<tr class="muted"><td>не принято (уехала петля): ${rw.rejected}</td><td>0 ${PG}</td></tr>`);
  if (rw.sum > rw.total) rows.push(`<tr class="cap"><td>потолок за забег ${ECON.RUN_CAP} ${PG}</td><td>−${rw.sum - rw.total} ${PG}</td></tr>`);
  if (earned < rw.total) rows.push(`<tr class="cap"><td>дневной лимит ${ECON.DAILY_CAP} ${PG}</td><td>−${rw.total - earned} ${PG}</td></tr>`);
  rows.push(`<tr class="tot"><td>Начислено</td><td>+${earned} ${PG}</td></tr>`);
  return rows.join('');
}

$('btnPlay').onclick = play;
$('overAgain').onclick = play;
$('overMenu').onclick = () => { G = null; show('menu'); };
$('btnBack').onclick = () => { if (G) G.S.over = true; G = null; show('menu'); };

// ---------- Меню ----------
function renderMenu() {
  $('walletNum').textContent = Wallet.balance;
  const best = save.best;
  $('playSub').innerHTML = `${RUN_TIME} секунд · оплата за каждую куртку${best ? ` · рекорд ${best}` : ''}<br>`
    + (Wallet.freeLeft() > 0 ? `<span class="price">🎁 бесплатно сегодня</span>` : `<span class="price">${ECON.ENTRY} ${PG}</span>`);
  const n = Streak.current(), need = ECON.STREAK_DAYS;
  const dots = Array.from({ length: need }, (_, i) => `<i class="${i < Math.min(n, need) ? 'on' : ''}"></i>`).join('');
  const sub = Streak.bonusToday() ? 'сегодня +1 бесплатный забег 🎁'
    : Streak.playedToday() ? `ещё ${need - n} дн. до +1 бесплатного забега` : `сыграй сегодня — до бонуса ${need - n} дн.`;
  $('streakCard').innerHTML = `<div class="dRow"><span class="ic">🔥</span><span>Серия: ${n} дн.<span class="dots3">${dots}</span><small>${sub}</small></span></div>`;
  $('streakCard').innerHTML += taskRowHTML();
  renderFabrics();
}
function renderFabrics() {
  const owned = Fabrics.owned(), cur = Fabrics.cur.id;
  $('fabrics').innerHTML = FABRICS.map(f => {
    const has = owned.has(f.id);
    return `<button class="sw${f.id === cur ? ' cur' : ''}${has ? '' : ' locked'}" data-id="${f.id}" title="${f.name}">
      <i style="background-image:url(${f.url})"></i><span class="tag">${has ? f.name : `${ECON.FABRIC_PRICE} ${PG}`}</span></button>`;
  }).join('');
  $('fabrics').querySelectorAll('.sw').forEach(b => b.onclick = () => fabricTap(b.dataset.id, b));
}
function fabricTap(id, btn) {
  const f = FABRICS.find(x => x.id === id);
  if (Fabrics.owned().has(id)) { Fabrics.cur = id; renderFabrics(); toast(`Ткань «${f.name}» выбрана`, 1500); return; }
  if (Wallet.balance < ECON.FABRIC_PRICE) { toast(`Не хватает пуговок: ткань стоит ${ECON.FABRIC_PRICE} ${PG}`); return; }
  if (!btn.classList.contains('confirm')) {
    btn.classList.add('confirm');
    setTimeout(() => { if (btn.isConnected) btn.classList.remove('confirm'); }, 3000);
    return;
  }
  Wallet.balance -= ECON.FABRIC_PRICE; Fabrics.own(id); Fabrics.cur = id;
  SFX.jacket(); buzz([30, 40, 60]);
  renderMenu();
  const w = $('menuWallet'); w.classList.remove('bump'); void w.offsetWidth; w.classList.add('bump');
  toast(`Новая ткань: ${f.name}!`, 1800);
}

$('btnHelp').onclick = () => toast(
  '🧥 Куртка едет вверх. На каждой петле — <b>силуэт пуговки</b>.<br>Тяни из лотка такую же: форму и размер.<br>'
  + 'Не та — отскочит. Уехала петля — −2 секунды.<br>Куртка застёгнута целиком — заказ оплачен пуговками,<br>следующая дороже и быстрее!', 7000);

// ---------- Правила ----------
function renderRules() {
  // Прейскурант из ECON.ORDER_PRICE: подряд идущие куртки с одной ценой — одной строкой
  const groups = [];
  ECON.ORDER_PRICE.forEach((p, k) => { const g = groups[groups.length - 1]; if (g && g.p === p) g.to = k + 1; else groups.push({ p, from: k + 1, to: k + 1 }); });
  const last = groups[groups.length - 1];
  const tiers = groups.map(g => `<tr><td>${g === last ? `куртка №${g.from} и дальше` : g.from === g.to ? `куртка №${g.from}` : `куртки №${g.from}–${g.to}`}</td><td>${g.p} ${PG}</td></tr>`).join('');
  $('rulesBody').innerHTML = `
    <div class="rcard"><h3>🧥 Как играть</h3><ul>
      <li>Забег — ${RUN_TIME} секунд. Время и лента пойдут с первого касания пуговки.</li>
      <li>Куртка едет вверх. На каждой петле — силуэт нужной пуговки. Перетащи из лотка такую же
        (или коснись пуговки, потом петли).</li>
      <li>Пуговки отличаются <b>формой и числом дырочек</b> (круглая — 4, квадратная — 2, цветок — 3), а с 3-й куртки
        ещё и <b>размером</b>. Цвет — только подсказка.</li>
      <li>Пуговка — <b>10</b> очков; застегнул, пока петля в нижней половине, — <b>20</b> («быстро!»).</li>
      <li>Пуговки подряд — множитель: каждые 5 — +1, до ×5.</li>
      <li>Не та пуговка — отскакивает, серия сначала. Петля уехала за красную линию — −${MISS_PENALTY} секунды и серия сначала.</li>
      <li>Вся куртка застёгнута — +${JACKET_BONUS}. Каждая следующая куртка едет быстрее, с 4-й ещё и покачивается.</li>
      <li>Все петли на виду застёгнуты — лента ускоряется: быстрые игроки успевают больше.</li></ul>
      <div class="kinds" id="kinds"></div></div>
    <div class="rcard"><h3>📅 Набор дня</h3><ul>
      <li>Куртки и петли каждый день одинаковые для всех и меняются в полночь.</li></ul></div>
    <div class="rcard"><h3>🎯 Задание дня</h3><ul>
      <li>Одно задание в день, одинаковое для всех, — проверяется по итогам забега: +${TASK_REWARD} ${PG} (в пределах дневного лимита).</li></ul></div>
    <div class="rcard"><h3>🎟 Вход</h3><ul>
      <li><b>${ECON.FREE_PER_DAY} бесплатный забег в день</b>, дальше — ${ECON.ENTRY} ${PG}.</li>
      <li>Вход списывается при первом касании пуговки. Открыл забег и вернулся в меню, не начав, — ничего не списано.</li>
      <li>Играешь ${ECON.STREAK_DAYS} дня подряд и дольше — каждый день +1 бесплатный забег.</li></ul></div>
    <div class="rcard"><h3>🧾 Оплата за заказ</h3><ul>
      <li>Каждая куртка, застёгнутая <b>целиком</b>, — оплаченный заказ. Чем дальше куртка (быстрее лента, больше петель), тем дороже заказ:</li></ul>
      <table>${tiers}</table>
      <ul><li>Уехала хоть одна петля — заказ <b>не принимается</b>: недостёгнутую куртку не оплачивают. «Не та» пуговка заказ не портит.</li>
      <li>Цена заказа — на бирке куртки, сумма за забег — в шапке («Оплачено»). Очки — для рекорда, на оплату не влияют.</li>
      <li>За один забег — не больше <b>${ECON.RUN_CAP} ${PG}</b>, за сутки — не больше <b>${ECON.DAILY_CAP} ${PG}</b>. Новый день — в полночь по вашему времени.</li></ul></div>
    <div class="rcard"><h3>🧵 Ткани куртки</h3><ul>
      <li>Ткань — ${ECON.FABRIC_PRICE} ${PG}. Только внешний вид, на очки не влияет.</li></ul></div>
    <div class="rcard honest"><h3>🤝 Честно</h3><ul>
      <li>Оплата зависит <b>только от застёгнутых курток</b>: никаких случайных выигрышей, лотерей и сундуков.</li>
      <li>Все цены и пороги — на этом экране, во время игры они не меняются.</li></ul></div>`;
  // Образцы пуговок: большая и маленькая каждой формы
  [0, 2, 4].forEach(t => {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    drawBtn(g, 54, 56, t, 40); drawBtn(g, 102, 96, t + 1, 26);
    $('kinds').appendChild(c);
  });
}
$('btnRules').onclick = () => { renderRules(); show('rules'); };
$('rulesBack').onclick = () => show('menu');
$('btnReset').onclick = () => {
  const b = $('btnReset');
  if (!b.classList.contains('confirm')) {
    b.classList.add('confirm'); b.textContent = 'Точно сбросить? Нажми ещё раз';
    setTimeout(() => { b.classList.remove('confirm'); b.textContent = '↺ Сбросить демо'; }, 3000);
    return;
  }
  ['wallet', 'day', 'streak', 'fabrics', 'fabric', 'best', 'seen', 'hand'].forEach(k => localStorage.removeItem(KEY(k)));
  location.reload();
};

// ---------- Иконка вкладки: квадратная пуговица ----------
(function icon() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  drawBtn(c.getContext('2d'), 64, 60, 2, 54);
  const l = document.createElement('link'); l.rel = 'icon'; l.href = c.toDataURL(); document.head.appendChild(l);
})();

// ---------- Задание дня ----------
// Одно на день, одинаковое для всех (выбирается по дате). Проверяется по итогам забега.
// Награда — TASK_REWARD пуговок, один раз в день, внутри дневного лимита.
const TASK_REWARD = 5;
const TASKS = [
  { text: 'Застегни 30 пуговок за забег',   ok: s => s.buttoned >= 30 },
  { text: 'Застегни 3 куртки целиком',      ok: s => s.full >= 3 },
  { text: 'Серия из 15 пуговок подряд',     ok: s => s.bestCombo >= 15 },
  { text: 'Набери 1500 очков',              ok: s => s.score >= 1500 },
];
const Task = {
  today() { let h = 0; for (const ch of 'task-' + dateKey()) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return TASKS[h % TASKS.length]; },
  done() { return !!Wallet.day().task; },
  check(st) {
    const t = this.today();
    if (this.done()) return { t, already: true };
    if (!t.ok(st)) return { t, ok: false };
    const d = Wallet.day(); d.task = true; Wallet.saveDay(d);
    return { t, ok: true, got: Wallet.credit(TASK_REWARD) };
  },
};
function taskRowHTML() {
  const t = Task.today(), done = Task.done();
  return `<div class="dRow${done ? ' ok' : ''}"><span class="ic">${done ? '✅' : '🎯'}</span>
    <span>${t.text}<small>задание дня</small></span><span class="rw">+${TASK_REWARD} ${PG}</span></div>`;
}
function taskLineHTML(r) {
  if (r.already) return { cls: 'taskLine', html: '✅ Задание дня уже выполнено сегодня' };
  if (r.ok) return { cls: 'taskLine ok', html: r.got > 0 ? `✅ Задание дня выполнено: «${r.t.text}» · +${r.got} ${PG}` : `✅ Задание дня выполнено — дневной лимит наград уже набран` };
  return { cls: 'taskLine', html: `🎯 Задание дня: «${r.t.text}» — пока не выполнено` };
}

// ---------- Первый запуск: сразу в игру, рука показывает, что делать ----------
// Бесплатная попытка списывается только при первом касании — открыл и ушёл в меню, попытка цела.
function onFirstStart() {
  hideHand();
  localStorage.setItem(KEY('hand'), '1');
  if (G && G.pendingPay) {
    G.pendingPay = false;               // флаг снимаем до списания — второго списания за забег не будет
    const how = Wallet.pay();
    if (how === 'paid') toast(`−${ECON.ENTRY} ${PG} за вход`, 1600);
    else if (!how) { G.S.over = true; G = null; show('menu'); toast(`Не хватает пуговок: забег стоит ${ECON.ENTRY} ${PG}`); }
  }
}
function handPath() {   // от нужной пуговки в лотке к первой петле
  const S = G.S, o = openHoles(S).sort((a, b) => a.y - b.y)[0]; if (!o) return null;
  const i = S.tray.indexOf(o.h.type); if (i < 0) return null;
  const r = cv.getBoundingClientRect();
  return [r.left + PX(TRAY_X[i]), r.top + PY(TRAY_Y), r.left + PX(o.x), r.top + PY(o.y)];
}
function maybeHand() {
  if (!G || G.started || localStorage.getItem(KEY('hand')) || !$('game').classList.contains('active')) return;
  const p = handPath(); if (!p) return;
  hideHand();
  const h = document.createElement('div');
  h.id = 'hand'; h.textContent = '👆';
  [['--x0', p[0]], ['--y0', p[1]], ['--x1', p[2]], ['--y1', p[3]]].forEach(([k, v], i) =>
    h.style.setProperty(k, (v - (i % 2 ? 6 : 14)) + 'px'));
  document.body.appendChild(h);
}
function hideHand() { const h = document.getElementById('hand'); if (h) h.remove(); }

refreshSound();
renderMenu();
if (!localStorage.getItem(KEY('seen'))) {
  localStorage.setItem(KEY('seen'), '1');
  if (Wallet.freeLeft() > 0) startRun(true);
}
