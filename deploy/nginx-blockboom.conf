# nginx для «Блок Бум!»
# Копировать в /etc/nginx/sites-available/blockboom и включить:
#   sudo ln -s /etc/nginx/sites-available/blockboom /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Потом HTTPS: sudo certbot --nginx -d ИМЯ_ДОМЕНА
#
# Замени ИМЯ_ДОМЕНА на свой домен (например game.example.com).
# Если домена нет — поставь вместо него IP сервера (HTTPS тогда не получится,
# игра будет работать по http://IP).

server {
    listen 80;
    server_name ИМЯ_ДОМЕНА;

    # WebSocket онлайн-боя
    location /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Сама игра
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }
}
